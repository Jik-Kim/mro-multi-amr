# 웹캠 파라미터 — docs/interfaces.md 8절 지정 파일. 담당: 한세교·김학민
#
# launch 에서 parameters=[<이 파일>] 로 넘겨야 적용된다 (mro_bringup, PM 담당).
# 시간 상수는 프레임 수가 아니라 초로 둔다 — 추론 주기를 바꿔도 의미가 유지되게 (interfaces.md)

webcam_register:            # 웹캠1 (PC-W1) — 작업자 등록 S1
  ros__parameters:
    model_path: ""          # 빈 값이면 mro_perception/models/worker.pt (단일 출처, PR #19).
                            # launch 가 절대경로를 넘긴다 — yaml 은 패키지 경로를 못 구한다
    target_classes: ["worker_a", "worker_b"]   # 이 클래스만 등록 대상 (오검출이 등록 자리를 뺏지 않게)
    webcam_index: -1        # -1 이면 자동 탐색(높은 번호부터). 내장 카메라가 있는 PC 는
                            # 자동 탐색이 그걸 고를 수 있다 (9/7 실제로 /dev/video0 을 잡았다) → 번호를 준다
    conf: 0.5               # 인지팀 perception.yaml 의 detect_conf 와 같은 값.
                            # F1 최적은 0.4 지만 오탐 = 오추종이라 AC-04(0건) 쪽으로 올려 잡는다
    process_hz: 10.0        # 계약값. YOLO 추론·발행 주기 (캡처 fps 와 다른 값이다)
    capture_fps: 25         # 웹캠1(Jieli) 장치 상한 (9/6 실측). 계약 v1.2 가 '장치 상한 그대로' 로 완화됨.
                            # 지켜야 하는 것은 숫자가 아니라 캡처 >= 발행 이다
    on_time_s: 0.3          # 계약값 — 이 시간 연속 검출되면 detected True
    off_time_s: 0.5         # 계약값 — 이 시간 연속 미검출이면 False
    register_s: 1.0         # 트랙이 이 시간 안정되면 worker_id 배정 (TS-U01: 등록 <= 10 s)
    publish_hz: 1.0         # 등록 결과 재발행. 관제가 늦게 켜져도 받게 한다
    max_workers: 2          # SOT 확정: 작업자 2명
    rematch_threshold: 0.7  # [잠정] 끊긴 트랙이 기존 등록자와 같은 사람인지 판정 (등록 슬롯 재사용).
                            # robotN.yaml 의 reid_threshold(로봇 페어링 허용)와는 다른 결정이다.
                            # 계약 v1.3: crop 이 인형 전체라 다른 인형끼리도 0.5 안팎에서 시작한다.
                            # worker.pt 수령 후 인형 2체로 분포를 재서 확정할 것
    show_window: true       # 로컬 미리보기 창

webcam_hint:                # 웹캠2 (PC-W2) — 재탐지 힌트 E-1. 한세교 담당, 값 확정 필요
  ros__parameters:
    fps: 30.0               # 카메라 캡처 주기
    process_hz: 10.0        # YOLO 처리 주기(0.1 s, 0.3 s 동안 약 3회)
    hint_valid_s: 2.0       # 계약값 — 이 시간 지난 힌트는 쓰지 않는다
    image_publish_hz: 10.0  # YOLO process_hz와 독립적인 압축 영상 발행 주기
    compressed_topic: "/webcam2/image_raw/compressed"
    image_frame_id: "webcam2_optical_frame"
    jpeg_quality: 80
    detection_confirm_count: 3 # 동일 track ID가 3회 검출되면 최초 확정
    detection_hold_s: 0.5     # 순간 누락 시 기존 트랙 연속성 유지 시간
    lost_confirm_s: 1.0       # 이 시간 이상 미검출 시 Lost 확정
