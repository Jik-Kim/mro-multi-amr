# 아레나 구역 정의 (BRD v3.2 3.1). 좌표는 새 맵 작성 후 RViz Publish Point 로 채운다 — 전부 [팀 입력 필요]
# 아레나 위상 (9/5 실측 도면)
#   좌: 작업공간 | 중앙: 개방 복도 | 우상: 도크(AMR 대기공간) | 우중: 대기공간 + 창고 A/B/C | 우하: 출입구 · 관제탑
#   통로 3곳 — 아래 passages 참조. 병목은 P1(로봇 전용)에만 만든다.
arena:
  map: auto_map.yaml
  bays:                       # Z-04. ArUco DICT_4X4_50
    A: {aruco_id: 1, waypoint: [-0.78, 0.138, -3.050]}      # x, y, yaw(rad). 9/6 정밀 실측
    B: {aruco_id: 2, waypoint: [-0.78, -0.554, 3.051]}      # 9/6 정밀 실측
    C: {aruco_id: 3, waypoint: [-0.78, -1.258, 3.013]}      # 9/6 정밀 실측
  waiting_zone:               # Z-05 합류 지점 (로봇별로 살짝 다른 정차 위치)
    robot3: [-0.998, 0.937, 1.696]   # 9/6 실측
    robot8: [-1.593, 0.935, 1.618]   # 9/6 실측
  dock_zone:                  # 도크 구역(아레나 Z-03) · 토큰 ID 는 DOCK — 복귀 시 한 번에 한 대만 진입 (S10, Create3 도크 IR 간섭 회피)
    # ★ 맵 좌표계의 핵심. 맵 원점은 SLAM 작성 시점의 단일 기준점이고, 도크는 그 맵 안의 '좌표값'이다.
    #   로봇은 기동 시 자신의 pose 값으로 초기 pose 를 설정한다(shuttle_mission_node.dock_pose).
    #   각자 (0,0) 으로 초기화하면 두 map 프레임의 원점이 달라져 세마포어·waypoint 가 전부 어긋난다.
    pose:                     # 도킹 상태의 로봇 pose [x, y, yaw_rad] — 9/6 실측(amcl_pose 수렴 확인 후)
      robot3: [0.019, -0.795, 0.133]
      robot8: [-0.023, 0.034, -0.052]
    spacing_m: 0.84           # 도킹점 기준 실측 (AMR 담당, 2026-09-06). 초기 0.9 는 어림값. AMCL dock_pose 간 0.83 과 일치. 여유가 없어 approach 경유 필수
    divider: false            # IR 차폐판은 두지 않는다 (9/6 주행 합의) — TS-U12 로봇별 10회, 차폐 없이 오도킹 0. 순차 진입은 DOCK 토큰이 보장
    approach:                 # 자기 도크 정면 접근 지점. 여기서 dock() 호출 — 멀리서 부르면 옆 도크로 갈 수 있다
      robot3: [-0.435, -0.710, -0.030]   # 9/6 실측
      robot8: [-0.479, 0.082, 0.059]     # 9/6 실측
    holding: [-0.422, 1.501, -1.689]  # 후행 로봇 대기 위치. 9/6 재실측(PM 검증 반영) — 최근접 도크(robot8)까지 1.52 m,
                                       #   선행 로봇 도킹 경로 밖. FR-31(≥1.5 m) 충족
  # 토큰은 로봇끼리만 경합하는 곳에만 둔다. 추종 경로에는 두지 않는다 —
  #   토큰을 기다리며 멈추면 작업자를 놓친다. 두 쌍의 출발을 엇갈리게 해서 회피한다.
  semaphore_zones:            # zone_semaphore ZONES 와 ID 일치. 9/6 재실측(PM 기하 검증 반영) — 맵 위에 그려서 벽 틈(출입구)·도크 위치와 대조 확인함
    P1:   {polygon: [[0, 0.9], [0, 0.45], [-0.8, 0.45], [-0.8, 0.9]]}          # 로봇구역↔중앙복도 병목(벽 틈) 0.79 m 통로 — 0.8x0.45m 로 통로를 완전히 가로지르도록 재실측
    DOCK: {polygon: [[0.2, 0.4], [0.2, -1.45], [-0.675, -1.45], [-0.675, 0.4]]}  # 도크 구역 — bays A/B/C(x=-0.78) 를 제외하도록 왼쪽 변을 x=-0.675 로 좁힘. dock_zone.pose/approach 는 전부 포함 확인
  # KOZ(접근 금지 구역)와 가상 차선은 **Phase 2 로 이관 (9/5)** — 축소 아레나에 항공기 상당물이 없다.
  # 되살릴 때는 keep_out / virtual_lane 키를 여기에 추가하고 Nav2 keepout 마스크를 함께 만든다.
  homography_marks:           # 십자 테이프 — 웹캠1·2 캘리브레이션 기준점. map 좌표를 함께 적어 재캘리브레이션을 반복 가능하게
    cam1: []                  # 쓰지 않는다 (9/6) — 웹캠1 은 등록만, map 좌표 없음
    cam2: []                  # 원본은 mro_webcam/config/WebCam2/marker_coordinates.json (PR #9, AMCL 실측). 여기에 복사하지 않는다
  loc_check_marker:           # 측위 검증 마커 — ArUco ID 4. 웹캠1 박스 북쪽 약 0.4 m 앞 거치대, 북향, 높이 23.5 cm (계약 6절·9.2 ①)
    aruco_id: 4
    xy: [0.0, 0.0]            # map 좌표 — 로봇을 마커 앞에 세우고 amcl_pose 로 실측 [주행 입력 필요 9/7]
    tolerance_m: 0.10         # |amcl_pose − xy| 와 aruco/distance 의 차이 허용치 (AMCL 오차 5~10 cm)
  # 주의: 벽 받침대(발)는 바닥에 붙어 있어 LiDAR 에 안 잡힌다. 아래 통로 폭은 받침대 돌출을 뺀 '실제 통과 가능 폭' 으로 적을 것 (I-004)
  # 통로 실측 9/5 (벽면 기준). 받침대 돌출을 뺀 실제 통과 폭은 별도 확인 — LiDAR 에 안 잡힌다 (I-004)
  passages:
    P1_dock_to_bay:           # 로봇 구역(도크·창고) ↔ 중앙 복도. **로봇 전용** — 작업자는 지나가지 않는다
      width_m: 0.79           # 벽 설치 후 실측 9/5 (설치 전 1.03). 벽면 기준인지 받침대 포함인지 확인 필요
      role: bottleneck        # S4(창고에서 대기공간으로 나올 때) + S10(복귀) 두 번 통과 → E-3 교착 · E-7 순차 도킹. 도크 → 창고는 벽 없이 이어져 지나지 않는다
      verified: false         # 아래 두 시험 통과 후 true — ① 1대 통과 ② 2대일 때 비집고 들어가지 않음
    P2_control_to_waiting:    # 관제탑 → 대기공간. 작업자 통행
      width_m: 0.86           # 9/6 재실측 (9/5 의 0.88 정정). 받침대 양쪽 3 cm → 실통과 0.80
      role: passage           # 이미 1대만 통과 가능. 손대지 않는다
    P3_to_workspace:          # 중앙 복도 → 작업공간. **추종 경로** — 웹캠2 가 봐야 한다
      width_m: 0.93           # 9/5 저녁 재실측 (0.88 → 0.93, 입구 아래 기둥 제거). 1대 여유 통과, 추종 중 회피 여지 ↑
      role: passage           # 벽 추가 금지
  # note (9/5 벽 설치 후 재계산 · 9/6 값 정리): P1 = 0.79 m.
  #   두 대 교행: TB4 0.34 x 2 = 0.68 m → 남는 폭 0.11 m (좌우 5.5 cm). AMCL 오차(5~10 cm)보다 작아
  #     물리적으로 교행이 불가능하다. E-3 교착이 성립하는 조건이므로 이대로 둔다.
  #   한 대 통과: 중앙이 벽에서 0.395 m. robot_radius 0.22 기준 여유 0.175 m.
  #     inflation_radius 를 r 로 두면 양쪽 벽에서 각 r 만큼이 고비용이 되어 가운데 자유 폭은 0.79 - 2r 이다.
  #       r = 0.30 (TB4 기본) → 0.19 m    r = 0.25 (채택 9/6) → 0.29 m    r = 0.22 → 0.35 m
  #     lethal 은 내접 반지름 0.175 안쪽뿐이라 r=0.25 에서도 로봇 중심이 지날 수 있는 하드 자유폭은 0.79 - 0.35 = 0.44 m 다.
  #     0.25 인 이유: 받침대(P3 최대 6.5 cm)가 LiDAR 18.5 cm 보다 낮아 costmap 에 안 잡힌다. 벽면과 로봇 표면 여유 = r - 0.175 ≥ 0.065 → r ≥ 0.24.
  #     실제 turtlebot4_navigation/nav2.yaml 값은 0.05 였다 (9/6 확인) — 내접 반지름보다 작아 완충 구간이 없었다.
  #   위는 전부 계산이다. 실주행으로 통과를 확인하기 전까지 검증된 값이 아니다 (I-009).
  #   동시 진입 방지의 1차 수단은 통로 폭이 아니라 zone_semaphore(DOCK·P1 토큰)다. 폭은 '세마포어가 없으면 정말 막힌다'를 성립시키는 조건.
  nav2_inflation_radius: 0.25 # 참고값 (9/6 주행 합의·PM 승인). 실제 적용은 PC-R3·PC-R8 의 turtlebot4_navigation nav2.yaml local·global 양쪽 — 저장소에서 Nav2 로 전달되는 경로는 없다 (I-009). 실주행 미검증
  # bay_dwell_s·t_lim_s·t_ret_s·dock_retry 는 여기 있었지만 **아무 코드도 안 읽었다** — 9/9 삭제.
  #   이 파일에서 실제로 읽히는 것은 bays · waiting_zone · dock_zone 셋뿐이다
  #   (shuttle_mission·return_dock). 그 넷의 단일 출처는 mro_bringup/params/common.yaml 이다.
