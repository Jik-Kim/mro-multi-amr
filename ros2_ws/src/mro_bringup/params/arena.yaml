# 아레나 구역 정의 (BRD v3.0 3.1). 좌표는 새 맵 작성 후 RViz Publish Point 로 채운다 — 전부 [팀 입력 필요]
# 아레나 위상 (9/5 실측 도면)
#   좌: 작업공간 | 중앙: 개방 복도 | 우상: 도크(AMR 대기공간) | 우중: 대기공간 + 창고 A/B/C | 우하: 출입구 · 관제탑
#   통로 3곳 — 아래 passages 참조. 병목은 P1(로봇 전용)에만 만든다.
arena:
  map: auto_map.yaml
  bays:                       # Z-04. ArUco DICT_4X4_50
    A: {aruco_id: 1, waypoint: [0.0, 0.0, 0.0]}     # x, y, yaw(rad)
    B: {aruco_id: 2, waypoint: [0.0, 0.0, 0.0]}
    C: {aruco_id: 3, waypoint: [0.0, 0.0, 0.0]}
  waiting_zone:               # Z-05 합류 지점 (로봇별로 살짝 다른 정차 위치)
    robot3: [0.0, 0.0, 0.0]
    robot4: [0.0, 0.0, 0.0]
  dock_zone:                  # Z-03 — 복귀 시 한 번에 한 대만 진입 (S10, Create3 도크 IR 간섭 회피)
    # ★ 맵 좌표계의 핵심. 맵 원점은 SLAM 작성 시점의 단일 기준점이고, 도크는 그 맵 안의 '좌표값'이다.
    #   로봇은 기동 시 자신의 pose 값으로 초기 pose 를 설정한다(shuttle_mission_node.dock_pose).
    #   각자 (0,0) 으로 초기화하면 두 map 프레임의 원점이 달라져 세마포어·waypoint 가 전부 어긋난다.
    pose:                     # 도킹 상태의 로봇 pose [x, y, yaw_rad] — RViz 로 실측해 기입 [팀 입력 필요]
      robot3: [0.0, 0.0, 0.0]
      robot4: [0.0, 0.0, 0.0]
    spacing_m: 0.9            # 도크 중심 간 실측 거리 (2026-09-05, ±5 cm). 여유가 없어 approach 경유 필수
    divider: true             # 도크 사이에 아레나 MDF 판 1장을 슬롯에 세워 IR 차폐 [팀 확정]
    approach:                 # 자기 도크 정면 접근 지점. 여기서 dock() 호출 — 멀리서 부르면 옆 도크로 갈 수 있다
      robot3: [0.0, 0.0, 0.0]
      robot4: [0.0, 0.0, 0.0]
    holding: [0.0, 0.0, 0.0]  # 후행 로봇 대기 위치. 도크에서 ≥ 1.5 m, 선행 로봇 도킹 경로 밖 [팀 확정]
  # 토큰은 로봇끼리만 경합하는 곳에만 둔다. 추종 경로에는 두지 않는다 —
  #   토큰을 기다리며 멈추면 작업자를 놓친다. 두 쌍의 출발을 엇갈리게 해서 회피한다.
  semaphore_zones:            # zone_semaphore ZONES 와 ID 일치 [폴리곤 실측 필요]
    P1:   {polygon: [[0, 0], [0, 0], [0, 0], [0, 0]]}   # 도크↔창고 병목 0.79 m — E-3 교착
    DOCK: {polygon: [[0, 0], [0, 0], [0, 0], [0, 0]]}   # 도크 구역 — E-7 순차 도킹
  # KOZ(접근 금지 구역)와 가상 차선은 **Phase 2 로 이관 (9/5)** — 축소 아레나에 항공기 상당물이 없다.
  # 되살릴 때는 keep_out / virtual_lane 키를 여기에 추가하고 Nav2 keepout 마스크를 함께 만든다.
  homography_marks:           # 십자 테이프 — 웹캠1·2 캘리브레이션 기준점. map 좌표를 함께 적어 재캘리브레이션을 반복 가능하게
    cam1: []                  # [[u_desc, x, y], ...] 형식은 docs/interfaces.md
    cam2: []
  bay_dwell_s: 5.0
  t_lim_s: 120.0
  # 주의: 벽 받침대(발)는 바닥에 붙어 있어 LiDAR 에 안 잡힌다. 아래 통로 폭은 받침대 돌출을 뺀 '실제 통과 가능 폭' 으로 적을 것 (I-004)
  # 통로 실측 9/5 (벽면 기준). 받침대 돌출을 뺀 실제 통과 폭은 별도 확인 — LiDAR 에 안 잡힌다 (I-004)
  passages:
    P1_dock_to_bay:           # 도크 → 창고. **로봇 전용** — 작업자는 지나가지 않는다
      width_m: 0.79           # 벽 설치 후 실측 9/5 (설치 전 1.03). 벽면 기준인지 받침대 포함인지 확인 필요
      role: bottleneck        # S4(창고 갈 때) + S10(복귀) 두 번 통과 → E-3 교착 · E-7 순차 도킹
      verified: false         # 아래 두 시험 통과 후 true — ① 1대 통과 ② 2대일 때 비집고 들어가지 않음
    P2_control_to_waiting:    # 관제탑 → 대기공간. 작업자 통행
      width_m: 0.88
      role: passage           # 이미 1대만 통과 가능. 손대지 않는다
    P3_to_workspace:          # 중앙 복도 → 작업공간. **추종 경로** — 웹캠2 가 봐야 한다
      width_m: 0.93           # 9/5 저녁 재실측 (0.88 → 0.93, 입구 아래 기둥 제거). 1대 여유 통과, 추종 중 회피 여지 ↑
      role: passage           # 벽 추가 금지
  # note (9/5 벽 설치 후 재계산): P1 = 0.79 m.
  #   두 대 교행: TB4 0.34 x 2 = 0.68 m → 남는 폭 0.11 m (좌우 5.5 cm). AMCL 오차(5~10 cm)보다 작아 물리적으로 교행 불가. 조건 충족.
  #   한 대 통과: 중앙이 벽에서 0.395 m. robot_radius 0.22 기준 여유 0.175 m — 통과 가능하나
  #     inflation_radius 기본값(0.3 안팎)이면 통로 전체가 인플레이션 영역이라 Nav2 가 고비용으로 헤맬 수 있다 → 0.25 안팎으로 하향 검토.
  #   동시 진입 방지의 1차 수단은 통로 폭이 아니라 zone_semaphore(Z-03/P1 토큰)다. 폭은 '세마포어가 없으면 정말 막힌다'를 성립시키는 조건.
  nav2_inflation_radius: 0.22 # 70 cm 통로 통과용 [팀 확정] — 기본값(0.3 안팎)이면 통로 전체가 고비용 처리됨
  t_ret_s: 180.0              # 종료 발행 → 도킹 완료 제한시간 [팀 가정]
  dock_retry: 2               # 도킹 실패 시 재시도 횟수
