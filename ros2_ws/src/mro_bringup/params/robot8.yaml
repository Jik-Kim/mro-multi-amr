# robot8 전용 값 — **로봇마다 달라야 하는 것만** 둔다. 공통값은 common.yaml 이 단일 출처다.
# robot.launch.py 가 namespace:=/robot8 일 때 이 파일을 마지막으로 넘긴다 (common·perception 을 이긴다).
#
# robot4 하드웨어 이슈로 9/8 교체 투입. 도크 슬롯은 robot4 자리를 그대로 쓴다.
/robot8/**:
  ros__parameters:
    robot_ns: /robot8
    # ★ 자신의 도크의 map 좌표 [x, y, yaw_rad]. arena.yaml 의 dock_zone.pose.robot8 과 같은 값.
    #   각 로봇이 (0,0) 으로 초기화하면 두 map 프레임이 어긋난다 (9/5).
    #   값은 robot4 가 쓰던 도크의 9/6 실측이다. 9/8 교체는 기체만 바꿨고 도크는 그대로라
    #   그대로 쓴다 (9/9 PM 판단) — 기체 개체차는 도킹 후 amcl_pose 편차 20 cm 에 묻힌다 (I-013).
    #   robot8 측위가 기동부터 어긋나면 이 값을 첫 번째로 의심한다.
    dock_pose: [-0.023, 0.034, -0.052]
    # ~~depth_k~~ **9/10 부로 없앤다 (PR #76).** ArUco 거리가 pnp 하나로 바뀌면서 `calibrated_depth` 와
    #   `depth_k` 파라미터가 함께 삭제됐다. FR-35 측위 검증도 이제 pnp 거리에 걸린다.
    #   **실측 기록은 남긴다** — depth 경로를 되살릴 일이 생기면 여기서 가져간다:
    #     robot8 k = 0.028 (9/8 렌즈면→마커 줄자, 각 50 프레임 중앙값. 0.91→원값 0.933 · 1.27→1.306 ·
    #     1.70→1.808. 잔차 −0.1 / −1.0 / +2.1 cm, 1.5 m 안은 ≤ 1 cm)
    #     robot3 0.024 · 옛 robot4 0.0076 — **개체차가 커서 옮겨 쓰면 안 된다.**
