# robot3 전용 값 — **로봇마다 달라야 하는 것만** 둔다. 공통값은 common.yaml 이 단일 출처다.
# robot.launch.py 가 namespace:=/robot3 일 때 이 파일을 마지막으로 넘긴다 (common·perception 을 이긴다).
#
# 로봇을 추가하려면 이 파일을 robotN.yaml 로 복사해 네임스페이스 2곳과 아래 실측 2개만 채운다.
/robot3/**:
  ros__parameters:
    robot_ns: /robot3
    # ★ 자신의 도크의 map 좌표 [x, y, yaw_rad]. arena.yaml 의 dock_zone.pose.robot3 와 같은 값.
    #   각 로봇이 (0,0) 으로 초기화하면 두 map 프레임이 어긋난다 (9/5). 9/6 실측
    dock_pose: [0.019, -0.795, 0.133]
    # ArUco 역깊이(시차) 편향, 1/m — 보정 z = depth_scale / (1/z_raw + depth_k) (core/aruco.calibrated_depth).
    #   **카메라 개체값이라 로봇을 바꾸면 다시 잰다.** 줄자 대조 k = 평균(1/줄자 − 1/원값), 0.8 m 이상 점만.
    #   9/7·9/8 4점: 0.85→원값 0.861 · 0.98→1.012 · 1.31→1.344 · 1.55→1.626 (잔차 −0.8~+1.5 cm)
    depth_k: 0.024
