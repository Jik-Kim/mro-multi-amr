# 로봇별 파라미터. launch 가 namespace:=robot3 와 함께 로드한다.
/robot3/**:
  ros__parameters:
    robot_ns: /robot3
    follow_standoff_m: 0.5
    min_separation_m: 0.3
    v_max: 0.3
    reid_threshold: 0.6
    bay_dwell_s: 5.0
    t_lim_s: 120.0
    t_ret_s: 180.0
    dock_retry: 2
    # ★ 자신의 도크의 map 좌표 [x, y, yaw_rad]. arena.yaml 의 dock_zone.pose.robot3 와 같은 값.
    #   각 로봇이 (0,0) 으로 초기화하면 두 map 프레임이 어긋난다 (9/5). [팀 입력 필요]
    dock_pose: [0.0, 0.0, 0.0]
