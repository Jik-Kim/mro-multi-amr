# 로봇 공통 파라미터 — **모든 로봇이 같은 값을 쓰는 것만** 둔다. 값의 단일 출처는 여기다 (계약 5절).
#
# robot.launch.py 가 [common.yaml, perception.yaml, robotN.yaml] 순으로 넘긴다 → 뒤에 오는 파일이 이긴다.
#   로봇마다 달라야 하는 값(dock_pose·depth_k)은 robotN.yaml 에만 적는다.
#   로봇을 추가·교체할 때 이 파일은 건드리지 않는다 — robotN.yaml 하나만 만들면 된다.
#
# reid_threshold 는 여기에 없다. 계약 5절대로 mro_perception/config/perception.yaml 이 단일 출처다
#   (종전에는 robotN.yaml 과 perception.yaml 양쪽에 있었다 — 9/8 정리).
/**:
  ros__parameters:
    follow_standoff_m: 0.5
    min_separation_m: 0.3
    v_max: 0.3
    bay_dwell_s: 5.0
    t_lim_s: 120.0            # 미션 제한시간. **로봇과 관제의 공유 계약값** — fleet_pc.launch.py 도
                              #   이 파일을 넘겨 fleet_manager 가 같은 값을 본다 (9/9 단일화).
                              #   갈라지면 로봇은 계속 가는데 관제만 TLIM_EXCEEDED 를 찍는다
    t_ret_s: 180.0
    dock_retry: 2
    # ── shuttle_mission (PR #36, 주행 요청으로 PM 이관 9/7)
    aruco_max_dist_m: 1.5     # 계약 6절 검출 조건. 인지도 max_distance_m 로 이미 자른다 (PR #30) — 이중 방어
    aruco_valid_s: 1.0        # aruco/id 와 aruco/distance 는 헤더가 없어 각자 수신 시각으로 신선도를 본다
    aruco_confirm_s: 3.0      # 베이 도착 확정까지 마커를 기다리는 시간
    aruco_retry: 1            # 미확인 시 **제자리 회전 재탐지** 스윕 횟수. 넘으면 오도착으로 포기 (FR-08).
                              #   9/8 의미 변경 — 옛 '정차 자세 재정렬'(같은 waypoint 로 goToPose 재전송)은
                              #   Nav2 허용오차 0.25 m 안이면 로봇이 안 움직여 사실상 무동작이었다
    # --- 마커 재탐지 (9/8 추가) — 병진 없이 제자리 회전만으로 좌우를 훑는다 ---
    #   마커를 못 본다는 것은 자기 위치를 못 믿는다는 뜻이라 어디로 갈지 모른다. 제자리 회전이
    #   footprint 밖으로 쓸고 가는 폭은 내접 0.175 / 외접 0.189 라 1.4 cm 뿐이다 (워치독과 같은 근거)
    aruco_search_enable: true
    aruco_search_step_deg: 15.0   # 정지점 간격. **카메라 수평 FOV 보다 확실히 작아야** 사이로 마커가 빠지지 않는다.
                                  #   robot3 실측 (9/8, camera_info): fx 566.7 -> 1007.4 (x1.7778 보정), 704 px 정사각 crop
                                  #   -> 수평 FOV = 2*atan(704/(2*1007.4)) = 38.5°. 15° 면 인접 정지점이 23.5° 겹친다
    aruco_search_max_deg: 60.0    # ±이 각까지 훑는다. 방위가 이보다 틀렸으면 마커가 아니라 측위가 깨진 것이고,
                                  #   더 돌면 옆 베이 마커를 볼 위험이 생긴다
    aruco_search_dwell_s: 0.8     # 정지점마다 확인하는 시간. 검출기 약 10 Hz 라 8프레임, aruco_valid_s 1.0 s 안이다
                                  #   총 예산 = 8 정지점 x (회전 ~1 s + 0.8 s) 약 15 s < T_lim 120 s
    token_retry_s: 2.0        # 계약 3절 '거절되면 2초 후 재요청'
    # ── safety_watchdog (I-036 · 계약 v1.13, 코드는 PR #52). 값의 단일 출처는 여기다 (계약 5절)
    stop_dist: 0.30           # 전방 부채꼴 안 이 거리보다 가까우면 estop. BRD 3.2 최소 이격 하한
    clear_dist: 0.38          # 해제 거리. 0.45 는 P1 반폭 0.395 보다 커서 통로 안에서는 어느 방향으로
                              #   돌아도 해제가 안 됐다 (I-036). 히스테리시스 8 cm = RPLIDAR A1 오차의 4배
    # I-049 초기 실주행값. 해제 5프레임이면 조기 종료, 시간·실측 각도 중 먼저 닿으면 정지.
    safe_rotate_rate: 0.25
    safe_rotate_timeout_s: 7.0        # PM 9/9: 각도가 먼저 걸려야 한다. 0.25 × 7 = 100° > 90°
    safe_rotate_max_angle_deg: 90.0   # 정면 벽 0.30 m 해제에 72.9°, 실측 0.29 m 에 75.3° 가 필요 (반각 35°,
                                      #   d/cos(θ−35°) > 0.38). 종전 75°/5 s 는 5 s 가 먼저 걸려 71.6° 뿐이었다
    scan_valid_s: 1.0         # 수신 공백이 이만큼이면 '스캔 없음' 으로 정지. 9/10 실주행에서 WiFi/DDS 공백이
                              #   1.46·1.05·0.73 s 로 세 번 있었다 (정상 간격 134 ms). 0.5 는 셋 다 estop 을
                              #   걸어 셔틀이 목표를 취소·재전송했다. 1.0 이면 0.3 m/s 로 최대 0.30 m 를 스캔
                              #   없이 가는데, 그 뒤에 Nav2 collision_monitor 와 Create3 범퍼가 있다
    odom_valid_s: 0.5
    # 정지 판정 초기 시험값 — odom 노이즈와 제동 지연을 실물에서 검증
    stopped_linear_mps: 0.01
    stopped_angular_rps: 0.02
    stopped_hold_s: 0.3
    pause_timeout_s: 2.0
    rotation_clearance_m: 0.21  # footprint 외접 0.189 m + 여유. LiDAR 기준 실물 검증 필요
    nav_cmd_valid_s: 0.5
    motion_cmd_topic: cmd_vel_search
    nav2_poll_s: 5.0          # bt_navigator 가 active 가 될 때까지 폴링 간격
    nav2_poll_max: 3          # 이 횟수 안에 active 가 아니면 T_lim 을 태우지 않고 곧장 포기 (I-035, PR #44). 기본값에서 약 10 s
    dock_status_wait_s: 15.0  # dock_status 를 기다리는 상한. 예전에는 무한 대기라 T_lim 조차 안 돌아 FAILED 도 안 나왔다 (가이드 D-2)
                              #   5.0 → 15.0 (9/10): 스택 전체를 다시 띄운 직후 디스커버리 폭주로 dock_status 공백이
                              #   3.6·4.7 s 였고(full_0910_0941) 5 s 를 놓쳐 초기자세를 건너뛰었다 → AMCL 자세 없음 →
                              #   map 프레임 없음 → costmap 실패. 9/9 run_0909_1019 와 같은 연쇄다. 노드 기본값(I-035)도 15 다
    # I-037 실험 초깃값 (9/8 병후 승인). 실물 검증 전 팀 확정값이 아니다.
    tf_pose_timeout_s: 3.0   # Nav2 완료 이후 새 TF를 기다리는 상한
    tf_max_age_s: 0.3        # map→base_link 공통 시각의 최대 지연
    arrival_xy_tolerance_m: 0.25  # Nav2 성공 후 별도로 검사. Nav2 설정 자체는 바꾸지 않는다

    # --- 베이 접근·정렬 (9/8 추가) — aruco/pose 로 마커 기준 상대 이동 ---
    # **옛 bay_advance_m(창고 안쪽 0.3 m 전진)을 대체한다.** 전진은 출발점을 모르는 상대량이라
    #   AMCL 오차 0.38~0.53 m 가 그대로 남았다. 지금은 목적지가 마커 기준 절대 위치라 출발점이
    #   어디든 도착점이 같다. Nav2 목표로는 못 한다 — SimpleGoalChecker 가 xy 0.25 m ·
    #   yaw 0.25 rad 라 이 크기의 이동을 '이미 도착' 으로 처리한다. Spin·DriveOnHeading 을 쓴다.
    bay_align_enable: true
    bay_marker_range_m: 0.9     # 접근 뒤 마커까지의 거리 [m] = **미션의 최종 정차 위치**.
                                #   **추정이 아니라 실측에서 나온 값이다 (9/8).** 접근 중 마커까지
                                #   0.715 m 인 순간 워치독이 `ESTOP: 전방 0.29 m` 를 냈다 — 빼면
                                #   **선반 앞면이 마커 벽에서 0.425 m 앞**이다. 여기서 바닥이 나온다:
                                #     워치독이 안 울리려면      0.425 + clear_dist 0.38 = 0.805 m
                                #     Nav2 충돌 예측을 피하려면 0.425 + 0.379          = 0.804 m
                                #   **0.80 m 가 하드 바닥**이고 0.5·0.6·0.7 은 전부 그 아래라 실패했다
                                #   (옆벽 충돌 / estop / 나오지 못함). 0.9 는 양쪽에 10 cm 여유를 둔 값이다.
                                #   옛 '0.3 m 전진' 이 세우던 자리가 0.87 m 였는데 우연히 이 바닥 바로
                                #   위여서 지금까지 문제가 안 드러났다. 0·음수는 설정 누락으로 포기한다.
                                #   **좌우 치우침 목표는 두지 않는다** — 마커를 향해 곧장 들어간다 (9/8 실주행).
                                #   '정면 정중앙' 을 목표로 삼으면 회전 φ 가 거리와 묶여 r*sin(φ) 만큼 옆걸음이
                                #   생기고, 좁은 베이 칸에서 그게 마커 없는 옆벽으로 로봇을 밀어 넣었다
    bay_align_min_range_m: 0.45  # 목표 거리의 하한. **Nav2 쪽 바닥이 결정한다** — DriveOnHeading 은 앞을
                                 #   속도x simulate_ahead_time (0.1x1.9=0.19 m) 내다보고 footprint 정면 0.189 를
                                 #   더해, 중심에서 약 0.38 m 안에 벽이 들어오면 스스로 중단한다 (9/8 실측
                                 #   Collision Ahead). 0.45 밑으로 두면 정상 접근이 매번 실패한다
    bay_align_max_iter: 2       # 실행 오차가 남으므로 다시 재고 한 번 더 잡는다
    bay_align_tol_xy_m: 0.05    # 이 안이면 도착으로 보고 더 안 움직인다
    bay_align_tol_yaw_deg: 5.0
    bay_align_min_turn_deg: 5.0   # 이보다 작은 회전은 **명령하지 않는다.** Nav2 의 Spin 은
                                  #   min_rotational_vel 0.4 rad/s 를 밑돌지 않고 제어 주기가 10 Hz 라
                                  #   한 사이클에 최소 2.3° 를 돌고 그만큼 지나친다. 9/8 실주행에서 0.37° 를
                                  #   명령했다가 오차가 쌓여 법선 오차가 8.3°→16.4°→-14.1° 로 발산했다.
                                  #   수렴 판정(bay_align_tol_yaw_deg)과 같은 값으로 두어야 앞뒤가 맞는다
    # 체류 뒤 칸 밖을 향해 제자리에서 도는 각 [deg]. 0 이면 끈다.
    #   **실주행 2회 연속으로 여기서 죽었다** (0.6 m·0.7 m 둘 다) — 체류를 마치고 대기공간 목표를
    #   받은 Nav2 가 90 초 넘게 진전을 못 내고 T_lim 을 넘겼다. 두 번째 회차엔 estop 조차 없었으니
    #   장애물이 아니라 경로를 못 푼 것이다. 로봇이 벽을 마주 본 채 출발 명령을 받는데, 후진이
    #   금지돼 있어 좁은 칸에서 스스로 180° 를 돌아야 하고 DWB 가 그걸 못 푼다. 우리가 대신 돌린다 —
    #   제자리 회전은 footprint 밖으로 1.4 cm 만 쓸고 가고, '제자리 회전 뒤 전진' 은 계약이 정한 방식이다
    bay_exit_turn_deg: 180.0
    bay_exit_drive_m: 0.5         # 돌고 나서 칸 밖으로 **우리가 곧게 빼 주는** 거리 [m]. 0 이면 바로 Nav2.
    # 탈출 회전은 Nav2 Spin 이 아니라 **cmd_vel_search 로 직접** 돈다 (9/10 10:19·10:39·13:23 세 회차 모두
    #   `Collision Ahead - Exiting Spin`). 13:23 은 360° 여유 0.35 m — 반지름 0.189 에 15 cm 남는데도 거부.
    #   Nav2 는 costmap(inflation 0.25, P1 통과에 필요) 으로 보고, 워치독은 실측 360° 거리(0.21)로 본다
    bay_exit_rate_rps: 0.5        # 회전 속도 [rad/s]. odom 이 0.35 s 늦어 1.5 면 30° 지나친다 (I-051) — 0.5 면 10°
    bay_exit_lead_deg: 10.0       # 지연·관성 몫을 미리 빼고 멈춘다. 몇 도 남아도 뒤는 Nav2 가 잡는다
                                  #   돌기만 하고 넘겼더니 DWB 가 칸 안에서 35 초를 헤맸다 (9/8 T17) —
                                  #   마커가 다시 1.0 m 로 보이도록 되돌아 도는 등 부자연스럽게 움직였다.
                                  #   칸을 벗어나는 구간까지만 우리가 처리하고 열린 곳에서 Nav2 에 넘긴다
    bay_align_samples: 5        # 중앙값을 낼 표본 수 — 한 프레임이 튀어도 이동량이 안 끌려간다
    bay_align_sample_s: 2.0     # 표본을 모으는 상한 (aruco 는 약 10 Hz)
    bay_align_max_step_m: 1.0   # 한 번에 움직일 상한. **접근 거리 전체가 여기 들어온다** —
                                #   waypoint 가 마커에서 1.2 m 면 이동이 0.7 m 다. 넘으면 측정을 의심하고 포기
    bay_align_speed_mps: 0.10   # DriveOnHeading 속도. 기본값 0.025 는 너무 느려 time_allowance 에 걸린다
    bay_align_timeout_s: 20     # Spin·DriveOnHeading time_allowance [정수 초]
    bay_align_use_marker_yaw: false  # 마커 자세로 각도를 잡을지. **9/8 저녁에 켜 봤다가 되돌렸다.**
                                #   T11 [측량] +1.8° -> -8.3° · T12 [마커] +8.3° -> +16.4° -> -14.1°.
                                #   **둘 다 나빠졌다** — 기준의 문제가 아니라 회전 분해능과 루프의 문제였고,
                                #   그건 bay_align_min_turn_deg 로 따로 고쳤다. T12 에서는 검출기 기운각도
                                #   9->17->22° 로 튀어 인지가 경고한 두 해 문제가 실제로 관측됐다.
                                #   루프를 고친 뒤에 다시 시험할 것 (변인통제: 한 번에 하나만)
    bay_align_yaw_gate_deg: 25.0     # 위를 켰을 때, 측량값과 이보다 어긋나면 뒤집힌 해로 보고 측량값을 쓴다

    # ── follow_target (추종). 9/9 코드에만 있던 값을 여기로 옮겼다 (계약 5절 단일 출처).
    #   값은 PR #56(9/9 실주행 3회)이 정한 것 그대로다 — 옮기기만 했고 바꾸지 않았다.
    #   follow_standoff_m·min_separation_m 은 위 공통 절에 이미 있어 여기 다시 적지 않는다.
    lost_s: 1.0               # 미검출 이 시간이면 Lost (SOT '.. Lost 1.0 s') — 계약값
    standby_s: 30.0           # Lost 가 이만큼 지속되면 STANDBY (SOT 'Standby 30 s') — 계약값
    approach_skip_m: 1.0      # 페어링 시 이 거리 안이면 접근 없이 바로 추종
    hint_valid_s: 2.0         # 계약 4절 '힌트 유효 2 s'. **유효기간은 받는 쪽만 판단한다** —
                              #   webcam_hint 는 힌트를 10 Hz 로 계속 낼 뿐이다. 그래서 이 값의
                              #   단일 출처는 여기 하나다 (I-047. 발행 측에도 있던 죽은 사본은 지웠다)
    # 재탐지 시간. 놓친 뒤 첫 회전까지 = research_s + search_wait_s (= 3.5 s).
    #   **lost_s 는 더해지지 않는다** — 같은 시계(마지막으로 본 뒤 지난 시간) 안의 앞 단계다.
    #   lost_s 에 주행을 멈추고, research_s 에 탐색으로 넘어간다.
    #   9/9 실주행에서 종전 값(8.0 + 3.0 = 11 s)이 너무 느렸다. 더 줄이려면 각 값의 바닥을 알아야 한다:
    #     research_s     사람이 앞을 지나가는 시간이 1~2 s 다. 이보다 짧으면 **잠깐 가린 것만으로
    #                    로봇이 등을 돌린다** — 작업자가 바로 앞에 있는데 돌아서는 것이 가장 나쁘다
    #     settle_s       30° 회전이 0.5 s 이고 그 뒤 AMCL 방위가 수렴할 시간. 이보다 짧으면
    #                    틀린 좌표로 목표를 낸다
    #     search_wait_s  settle_s + 검출 몇 프레임. 인지가 초당 5~8 장이라 1.5 s 면 8~12 장이다
    #   빨리 도는 것이 안전해진 이유는 **방향을 알게 됐기 때문**이다 (웹캠2 힌트로 회전 방향 잠금).
    research_s: 2.0           # 이 시간 안 보이면 회전 탐색으로
    settle_s: 1.0             # 이동·회전 뒤 이 시간 지난 좌표만 신뢰
    search_wait_s: 1.5        # 회전 후 이만큼 기다려도 못 찾으면 또 회전
    visible_wait_s: 3.0       # 보이는데 좌표가 계속 걸러지면 이만큼만 기다리고 회전
    search_step_deg: 20.0     # 재탐색 정지점 간격 (시야 38.5° 보다 작게)
