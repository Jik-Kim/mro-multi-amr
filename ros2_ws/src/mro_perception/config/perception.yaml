# mro_perception 노드 파라미터 — 계약 5절이 지정한 인지 소유 파일. 담당 정정인·민범진
# launch 가 이 파일을 넘긴다 (mro_bringup/launch/robot.launch.py)
/**:
  ros__parameters:
    # --- 공용 (두 노드가 core/camera.py 로 같이 쓴다) ---
    camera_fx_scale: 1.8336    # camera_info 의 fx·fy 가 704×704 crop 영상에 안 맞아 곱해 주는 값 (I-031).
                               # 그 전에는 정사각 crop 기하에서 어림한 16/9 = 1.7778 을 썼다.
                               #
                               # **확정 근거는 줄자다 (9/10). 체커보드는 출발점일 뿐이다.**
                               # 체커보드(tools/checker_calib.py)로 58·63장씩 찍어 두 대 모두 fx ≈ 1038 이
                               # 나왔지만, 같은 사진에서 20장씩 다시 풀면 배율이 robot3 28 % · robot8 13 %
                               # 폭으로 흔들린다. 값 하나만 보고 확정할 수 없어 줄자로 판정했다:
                               #   robot3  0.575 / 0.66 / 0.87 / 1.07 / 1.455 m  — 전 구간 1.7 cm 안
                               #   robot8  0.980 / 1.265 / 1.530 m               — +0.5 / +1.2 / +3.2 cm
                               # 운용 구간은 0.9 m(베이 최종 정차) ~ 1.5 m(계약 6절 검출 한계)이고,
                               # 두 대 모두 그 구간에서 판정 기준 10 cm 의 1/3 안에 든다. 로봇별로
                               # 나눌 이유가 없어 공용으로 쓴다.
                               #
                               # **마커에 흰 여백이 없으면 이 값이 맞아도 거리가 틀린다** (9/10 robot8,
                               # 최대 −16 %). 검은 테두리가 벽 경계선과 붙으면 꼭짓점이 바깥으로 끌려가
                               # 사각형이 커지고 거리가 가깝게 나온다. 재투영 오차는 깨끗해서 안 드러난다.
                               # 계약 6절이 요구하는 여백(한 칸 이상 ≈ 2 cm)을 반드시 둔다.
                               #
                               # 주점(cx·cy)은 곱하지 않는다 — 로봇이 싣고 오는 값이 참값이다.
                               # robot8 은 cy 가 367.6 으로 중앙(352)에서 15.6 px 벗어나 있는데 정상이다
                               # (가로 cx 는 352.4 로 가운데. 배율은 폭 기준이라 영향 없다).
                               #
                               # **amr_detection 과 공용이다.** 1.7778 → 1.8336 은 fx 를 +3.14 % 키우는데,
                               # 두 토픽에 **반대 방향**으로 나타난다:
                               #   aruco/distance    +3.1 % 커진다   d = fx × 마커크기 ÷ 픽셀 (fx 가 분자)
                               #   target/map_point  좌우 3.0 % 줄어든다  x = (u−cx) × z ÷ fx (fx 가 분모)
                               # map_point 절대량은 작다 — 1.1 m 에서 화면 중앙 0 · 100 px 옆 0.33 cm ·
                               # 화면 맨 끝 1.17 cm. target/distance(depth)는 영향 없다.
                               # 근본 해결은 로봇이 영상과 맞는 camera_info 를 내보내는 것. 그때 1.0 으로 되돌린다

    # --- amr_detection_node (17개 전부 declare_parameter 로 읽는다 · camera_fx_scale 은 위 공용 · README §3 과 1:1) ---
    detect_conf: 0.5           # 학습 conf 스윕의 F1 최적은 0.4 지만 올려 쓴다.
                               # 미탐은 Lost 후 재탐지 절차가 있고 K-04 로 측정되지만, 오탐은 오추종이고
                               # AC-04 는 0건이 절대 기준이다. 0.4→0.6 에서 오탐 6→2, 재현율은 1 %p 만 하락
    max_core_gap_mm: 150       # ROI 핵심부(p20~median) 가 이 이상 벌어지면 거리값 불신 → map 좌표 폐기
    bbox_inner: 0.5            # 거리 측정에 쓰는 bbox 중심부 비율. 가장자리는 배경 depth 가 섞인다
    sync_slop_s: 0.1           # RGB·depth ApproximateTimeSynchronizer 허용 시차.
                               # 9/7 실측 stamp 차 median 0.1 ms 지만 robot3 최댓값이 99.9 ms 로 이 값에
                               # 붙어 있다. 통합 때 쌍 성립률(9/7 기준 98.4 %)이 떨어지면 올린다
    reid_threshold: 0.6        # Q-13 [팀 확정 필요] — 같은/다른 인형 유사도 분포로 결정, 마감 9/8.
                               # 계약 5절대로 이 파일이 단일 출처다 — robotN.yaml 의 중복 항목은 삭제했다 (9/8)
    descriptor_frames: 10      # 색 지문 평균 창. 웹캠1 DESCRIPTOR_FRAMES 와 같아야 같은 척도
    pair_on_s: 1.0             # 이 시간 연속 통과해야 paired=True (웹캠1 register_s 와 같은 발상)
    pair_off_s: 3.0            # 이 시간 연속 실패·미검출이면 paired=False [팀 확정 필요]
    publish_hz: 1.0            # target/paired · target/worker_id 재발행 주기
    jpeg_quality: 80           # target/image/compressed 품질. 웹캠 노드와 같은 값
    gate_fail_s: 30.0          # 작업자가 보이는데 게이트를 이 시간 넘게 못 넘으면 target/pair_state=GATE_FAIL
                               # → 관제 UI 에 명시 페어링 버튼 (FR-13, 계약 10.1 의 30 s). 안 보이는 시간은 세지 않는다
    manual_pair_max_m: 1.0     # 명시 페어링을 받는 최대 거리(m). FR-14 의 1 m — 멀면 좌표 오차가 커서 수동도 소용없다
    target_stale_s: 1.0        # 마지막으로 본 후보·거리를 "지금" 으로 치는 시간(초). 프레임 주기(0.1 s)의 열 배.
                               # 프레임이 이보다 늦어지면 폴백 버튼이 안 뜨고 요청도 NO_TARGET 으로 거절된다 —
                               # 렉이 나는 현장에서는 2~3 으로 올린다 (I-045)
    show_window: false         # 로컬 미리보기 창. 기본은 끔 — launch 가 이 파일을 모든 로봇에 넘기는데
                               # 화면 없는 PC(SSH)에서 창을 못 만들면 노드가 죽어 회차가 통째로 날아간다 (I-043).
                               # 보고 싶으면 여기서 true 로 (실행 중에는 못 바꾼다 — 창은 기동 때 만들어진다).
                               # 영상은 rqt_image_view 로 target/image/compressed 를 보는 편이 낫다 — 어느 PC 에서든 된다

    # --- aruco_detector_node (계산은 core/aruco.py · camera_fx_scale 은 위 공용) ---
    # 거리는 마커 네 꼭짓점만으로 낸다 (solvePnP). d = fx × marker_size_m ÷ 화면 마커 픽셀 크기.
    # 9/9 체커보드로 fx 를 실측하면서 depth 경로(distance_source · depth_k · depth_scale ·
    # depth_min_m · pair_tol_s · depth_wait_s · fx_ratio_log_s)를 전부 걷어냈다 — 그 값들은
    # 어림한 fx 를 depth 로 눈금 맞추기 위한 장치였다. 노드 304줄 → 179줄.
    marker_size_m: 0.10        # 인쇄된 검은 사각형 한 변 실측값 (9/7 자로 확인, 4장 동일).
                               # 거리에 정비례한다 — fx 와 함께 곱으로만 들어가는 두 값 중 하나다
    marker_ids: [1, 2, 3, 4]   # 1·2·3 베이 A/B/C (FR-08) · 4 대기공간 측위 검증 (FR-35, 계약 9.2 ①).
                               # **4 를 빼면 관제의 측위 검증이 죽는다.** 10~19 는 Phase 2 예약이라 넣지 않는다
    max_distance_m: 2.0        # 이보다 멀면 '못 봤다'(id = -1). 원거리 오검출을 거르는 느슨한 한계다 —
                               # 주행이 aruco_max_dist_m 1.5 로 다시 자른다(계약 6절 검출 조건).
                               # 1.5 로 두면 정확히 1.5 m 에 둔 마커가 1.52 로 걸러진다 (I-031 PM 재현)
    publish_pose: true         # aruco/pose(PoseStamped, 카메라 광학 프레임) — 마커 중심 위치·자세. 주행 베이 정렬용
                               # (계약 4절, PR #40). 위치는 solvePnP 의 tvec 그대로라 aruco/distance 와 같은 자다
    publish_pose_log: true     # 검출 로그에 거리·기운각 남김. 통합 때 시끄러우면 false

# 로봇별 값은 **여기 있지 않다** — mro_bringup/params/robotN.yaml 에 있다 (9/8).
#   로봇마다 다른 값은 한 파일에 모아 두려는 것이다: 로봇을 추가할 때 이 파일은 건드리지 않는다.
#   robot.launch.py 가 [common.yaml, perception.yaml, robotN.yaml] 순으로 넘긴다 — 광역(/**) 파일이 먼저,
#   로봇별(/robotN/**) 파일이 마지막이어야 로봇별 값이 이긴다. **이 파일에 /robotN/** 블록을 다시 넣지 말 것**:
#   이 파일이 robotN.yaml 보다 먼저 오므로, 여기 있는 /robotN/** 는 묶음 순서가 앞당겨져 되레 덮인다.
#   실제로 그래서 9/8 이전까지 robot3 의 depth_k 0.024 가 안 먹고 0.0 으로 돌고 있었다 (I-040).
#
# robotN.yaml 의 `depth_k` 는 **9/9 부로 아무도 읽지 않는다** — aruco_detector 가 depth 를 안 쓰게 됐고,
#   선언되지 않은 파라미터는 조용히 무시된다. 삭제는 mro_bringup 소관이라 여기서 하지 않았다.
#   (인형 추종의 target/distance 는 amr_detection 이 depth 를 그대로 쓰지만 depth_k 를 쓰지는 않는다.)
