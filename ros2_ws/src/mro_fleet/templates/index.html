<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MRO Fleet 관제</title>
  <style>
    :root{--navy:#10265a;--blue:#1769e8;--blue-soft:#edf5ff;--green:#16a34a;--green-soft:#edf9f1;--red:#e53e3e;--line:#d8e3f2;--muted:#66758f;--page:#f5f8fc}
    *{box-sizing:border-box}body{margin:0;min-width:1100px;background:var(--page);color:var(--navy);font-family:"Noto Sans KR","Pretendard",Arial,sans-serif}button,select{font:inherit}button{cursor:pointer}.dashboard{min-height:100vh;padding:18px 22px 12px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.topbar h1{margin:0;font-size:31px;letter-spacing:-.8px}.connection{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700}.dot{width:10px;height:10px;border-radius:50%;background:#16bf50}.dot.offline{background:var(--red)}.divider{width:1px;height:16px;background:var(--line)}
    .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}.card{border:1px solid var(--line);border-radius:10px;background:#fff}.summary-card{min-height:86px;display:flex;align-items:center;gap:16px;padding:14px 18px}.summary-icon{width:54px;height:54px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-size:27px}.summary-card.alert .summary-icon{color:var(--red);background:#fff1f1}.summary-label{font-size:14px;font-weight:800}.summary-value{margin-top:3px;font-size:29px;font-weight:900}.summary-note{margin-left:7px;font-size:13px;color:var(--muted);font-weight:600}.ok{color:var(--green)}
    .request-card{min-height:58px;display:grid;grid-template-columns:auto 155px 155px 145px 1fr;align-items:center;gap:14px;padding:9px 16px;margin-bottom:12px}.section-title{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:900;white-space:nowrap}select{width:100%;height:38px;padding:0 12px;border:1px solid #c9d7eb;border-radius:7px;background:#fff;color:var(--navy);font-weight:700}.primary-button{height:40px;border:0;border-radius:7px;background:var(--blue);color:#fff;font-weight:800}.request-result{min-height:40px;display:flex;align-items:center;padding:8px 14px;border:1px solid #9fc4fb;border-radius:7px;background:#f7fbff;color:#1556b8;font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .main-grid{display:grid;grid-template-columns:minmax(515px,1fr) minmax(515px,1fr);gap:12px;min-height:500px}.robot-column{display:grid;grid-template-rows:1fr 1fr;gap:12px}.robot-card{display:grid;grid-template-columns:41% 59%;min-height:242px;padding:13px 15px;transition:.2s}.robot-card.estop{border:2px solid var(--red);box-shadow:0 0 0 4px rgba(229,62,62,.12)}.robot-main{padding-right:17px;border-right:1px solid #e2eaf5}.robot-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.robot-name{margin:0;font-size:25px}.badge{min-width:118px;padding:7px 12px;border:1px solid #b7d3fa;border-radius:18px;background:var(--blue-soft);color:#1762cb;text-align:center;font-size:13px;font-weight:900}.badge.green{border-color:#a8ddb7;background:var(--green-soft);color:var(--green)}.badge.red{border-color:#ef9a9a;background:#fff1f1;color:var(--red)}
    .badge.muted{border-color:#c7d0dc;background:#f3f5f8;color:var(--muted)}.info-row{min-height:34px;display:grid;grid-template-columns:84px 1fr;align-items:center;border-bottom:1px solid #edf1f7;font-size:14px}.info-label{color:var(--muted);font-weight:800}.info-value{font-weight:800}.battery-wrap{display:flex;align-items:center;gap:9px}.battery-track{flex:1;height:8px;border-radius:8px;background:#e7edf5;overflow:hidden}.battery-fill{display:block;height:100%;border-radius:inherit;background:var(--blue)}.card-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:9px}.detail-button,.return-one-button{padding:6px 9px;border-radius:6px;background:#fff;font-size:12px;font-weight:900}.detail-button{border:1px solid #a8c8f8;color:var(--blue)}.return-one-button{border:1px solid #efb08e;color:#d95015}
    .robot-progress{padding-left:17px;display:flex;flex-direction:column;gap:9px}.progress-title{font-size:14px;font-weight:900}.steps{display:flex;align-items:flex-start}.step{flex:1;position:relative;text-align:center;color:#75839a;font-size:12px;font-weight:800}.step:not(:last-child)::after{content:"";position:absolute;top:8px;left:58%;right:-42%;height:2px;background:#ced9e8}.step-circle{position:relative;z-index:1;width:17px;height:17px;margin:0 auto 5px;border:2px solid #bfcbda;border-radius:50%;background:#fff}.step.done .step-circle{border-color:#8aa4c9;background:#edf3fa}.step.current{color:var(--blue)}.step.current .step-circle{border:4px solid #cde0ff;background:var(--blue);box-shadow:0 0 0 2px var(--blue)}.robot-card[data-color="green"] .step.current{color:var(--green)}.robot-card[data-color="green"] .step.current .step-circle{border-color:#cbeed5;background:var(--green);box-shadow:0 0 0 2px var(--green)}
    .location-row{display:flex;gap:8px;margin-top:auto}.location-box{flex:1;min-width:0;padding:11px 13px;border-radius:8px;background:var(--blue-soft)}.robot-card[data-color="green"] .location-box{background:var(--green-soft)}.location-label{font-size:12px;font-weight:800;color:var(--muted)}.location-text{margin-top:3px;font-size:17px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fallback-button{width:96px;border:1px solid #efae55;border-radius:8px;background:#fff8eb;color:#b86600;font-size:12px;font-weight:900}.fallback-button[hidden]{display:none}
    .map-card{padding:13px;min-width:0}.map-card h2{margin:0 0 9px;font-size:20px}.map-container{position:relative;height:calc(100% - 35px);min-height:450px;overflow:hidden;border:1px solid #cad7e7;border-radius:8px;background:#dfe6ec;display:grid;place-items:center}.map-stage{position:relative;overflow:hidden;box-shadow:0 2px 12px rgba(18,40,76,.18);background:#cdd5dc}.map-stage[hidden]{display:none}.map-canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.map-status{padding:12px 16px;border-radius:8px;background:rgba(255,255,255,.92);color:var(--muted);font-size:13px;font-weight:800}.map-status.error{color:var(--red)}.monitor-alert{margin-bottom:12px;padding:11px 15px;border:1px solid #f0b4b4;border-radius:9px;background:#fff1f1;color:var(--red);font-size:13px;font-weight:800}.monitor-alert[hidden]{display:none}
    .robot-marker{position:absolute;z-index:3;transform:translate(-50%,-50%);width:0;height:34px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--blue);font-size:12px;font-weight:900;transition:left .8s linear,top .8s linear}.robot-marker[hidden]{display:none}.robot-marker.stale{opacity:.45}.robot-marker.green{color:var(--green)}.marker-icon{flex:none;width:34px;height:34px;display:grid;place-items:center;border:3px solid currentColor;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(18,40,76,.18);font-size:18px;transform:rotate(var(--heading,0deg));transition:transform .3s linear}.robot-marker.estop .marker-icon{border-color:var(--red);box-shadow:0 0 0 6px rgba(229,62,62,.18);animation:pulse 1.2s infinite}.robot-marker.estop::after{content:"안전 정지";flex:none;padding:3px 7px;border-radius:10px;background:var(--red);color:#fff}.dock-reference{position:absolute;z-index:2;transform:translate(-50%,-50%);width:22px;height:0;display:flex;align-items:center;gap:4px;color:#d97706;font-size:10px;font-weight:900;white-space:nowrap}.dock-arrow{flex:none;width:22px;height:22px;display:grid;place-items:center;border:2px dashed #d97706;border-radius:50%;background:rgba(255,248,235,.9);transform:rotate(var(--heading,0deg))}@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(229,62,62,.05)}}.token-strip{position:absolute;z-index:4;top:10px;right:10px;display:flex;gap:8px;padding:7px 10px;border:1px solid #cfdaea;border-radius:7px;background:rgba(255,255,255,.93);font-size:12px;font-weight:800}
    .return-card{min-height:73px;display:grid;grid-template-columns:270px 1fr 350px;align-items:center;gap:20px;margin-top:10px;padding:9px 16px}.return-title{font-size:18px;font-weight:900}.return-title small{display:block;margin-top:4px;color:var(--muted);font-size:11px;font-weight:600}.return-statuses{display:flex;justify-content:center;gap:35px;font-size:13px;font-weight:800}.return-actions{display:grid;gap:5px}.return-button{height:34px;border:1px solid #f06d2d;border-radius:6px;background:#fff;color:#ea5618;font-weight:900}.command-message{min-height:15px;text-align:center;color:var(--muted);font-size:11px;font-weight:700}
    .event-card{margin-top:8px;overflow:hidden}.event-summary{width:100%;height:38px;display:grid;grid-template-columns:145px 1fr auto;align-items:center;gap:15px;padding:0 16px;border:0;background:#fff;color:var(--navy);text-align:left}.event-summary strong{font-size:15px}.latest-event{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;color:var(--muted)}.event-toggle{color:var(--blue);font-size:12px;font-weight:900}.event-list{display:none;padding:4px 16px 14px;border-top:1px solid #edf1f7}.event-card.open .event-list{display:block}.event-table{width:100%;border-collapse:collapse;font-size:12px}.event-table th,.event-table td{padding:8px;border-bottom:1px solid #edf1f7;text-align:left}.event-table th{color:var(--muted)}
    .drawer{position:fixed;z-index:20;top:0;right:0;bottom:0;width:370px;padding:18px;border-left:1px solid var(--line);background:#fff;box-shadow:-12px 0 30px rgba(20,48,92,.14);transform:translateX(105%);transition:transform .25s ease;overflow-y:auto}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.drawer-title{margin:0;font-size:22px}.close-icon{border:0;background:transparent;color:var(--navy);font-size:24px}.drawer-summary,.drawer-section{padding:12px;border:1px solid var(--line);border-radius:8px}.drawer-summary-line{display:flex;align-items:center;justify-content:space-between}.drawer-robot-name{font-size:20px;font-weight:900}.drawer-received{margin-top:5px;text-align:right;color:var(--muted);font-size:12px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin:12px 0;background:#f1f5fa;border-radius:7px}.tab-button{padding:9px 3px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:800}.tab-button.active{color:var(--blue);border-bottom:2px solid var(--blue)}.tab-panel{display:none}.tab-panel.active{display:block}.drawer-section{margin-bottom:12px}.drawer-section h3{margin:0 0 8px;font-size:14px}.drawer-row{display:grid;grid-template-columns:90px 1fr;padding:7px 0;border-bottom:1px solid #edf1f7;font-size:12px}.drawer-row:last-child{border-bottom:0}.drawer-row span:first-child{color:var(--muted);font-weight:800}.drawer-row span:last-child{font-weight:800}.pairing-control{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pairing-control button{border:0;border-radius:6px;background:#d97706;color:#fff;font-weight:900}.pairing-message{grid-column:1/-1;min-height:18px;color:var(--muted);font-size:12px}.drawer-close{width:100%;height:38px;border:1px solid var(--blue);border-radius:6px;background:#fff;color:var(--blue);font-weight:900}
  </style>
</head>
<body>
<main class="dashboard">
  <div class="monitor-alert" id="monitorAlert" role="alert" hidden></div>
  <header class="topbar"><h1>MRO Fleet 관제</h1><div class="connection"><span class="dot offline" id="connectionDot"></span><span id="connectionText">로봇 상태 수신 대기</span><span class="divider"></span><span>최근 갱신 <strong id="globalLastUpdate">수신 전</strong></span></div></header>
  <section class="summary-grid" aria-label="운영 요약">
    <article class="summary-card card"><div class="summary-icon">🤖</div><div><div class="summary-label">로봇 상태 수신</div><div class="summary-value"><span id="connectedCount">0</span> / 2</div></div></article>
    <article class="summary-card card"><div class="summary-icon">👤</div><div><div class="summary-label">페어링 작업자</div><div class="summary-value"><span id="workerCount">0</span><span class="summary-note">명</span></div></div></article>
    <article class="summary-card card"><div class="summary-icon">▤</div><div><div class="summary-label">진행 미션</div><div class="summary-value"><span id="missionCount">0</span><span class="summary-note">건</span></div></div></article>
    <article class="summary-card card alert"><div class="summary-icon">!</div><div><div class="summary-label">E-STOP</div><div class="summary-value"><span id="estopCount">—</span><span class="summary-note">건 · <b id="estopSummary">확인 불가</b></span></div></div></article>
  </section>
  <form class="request-card card" id="requestForm"><div class="section-title"><span>◇</span><span>자재 요청</span></div><select id="requestWorker" aria-label="작업자 선택"><option value="W1">작업자 W1</option><option value="W2">작업자 W2</option></select><select id="requestBay" aria-label="창고 선택"><option value="A">창고 A</option><option value="B" selected>창고 B</option><option value="C">창고 C</option></select><button class="primary-button" id="requestButton" type="submit">자재 요청</button><div class="request-result" id="requestResult" aria-live="polite">요청 대기</div></form>
  <section class="main-grid"><div class="robot-column" id="robotCards"></div>
    <section class="map-card card"><h2>AMR 실시간 운행 맵</h2><div class="map-container" id="mapContainer">
      <div class="map-status" id="mapStatus">실제 맵 불러오는 중</div>
      <div class="map-stage" id="mapStage" hidden><canvas class="map-canvas" id="mapCanvas" aria-label="반시계 방향 90도로 회전한 auto_map 점유 맵"></canvas><div class="robot-marker" id="marker-robot3" hidden><div class="marker-icon">➤</div><span>robot3</span></div><div class="robot-marker green" id="marker-robot8" hidden><div class="marker-icon">➤</div><span>robot8</span></div></div>
      <div class="token-strip"><span>P1 토큰: 확인 불가</span><span class="divider"></span><span>DOCK 토큰: 확인 불가</span></div>
    </div></section>
  </section>
  <section class="return-card card"><div class="return-title">◉ 전체 작업 종료<small>모든 로봇의 작업을 종료하고 순차 복귀시킵니다.</small></div><div class="return-statuses"><span>🤖 robot3 <b id="returnStatusRobot3">상태 수신 대기</b></span><span>🤖 robot8 <b id="returnStatusRobot8">상태 수신 대기</b></span></div><div class="return-actions"><button class="return-button" id="returnAllButton" type="button">전체 작업 종료 → 복귀</button><div class="command-message" id="commandMessage" aria-live="polite">명령 대기</div></div></section>
  <section class="event-card card" id="eventCard"><button class="event-summary" id="eventToggle" type="button" aria-expanded="false"><strong>● 이벤트 로그</strong><span class="latest-event">이벤트 로그 기능 연동 대기</span><span class="event-toggle" id="eventToggleLabel">펼치기 ▼</span></button><div class="event-list"><table class="event-table"><thead><tr><th>시각</th><th>로봇</th><th>미션</th><th>이벤트</th><th>내용</th></tr></thead><tbody id="eventRows"></tbody></table></div></section>
</main>
<aside class="drawer" id="detailDrawer" aria-hidden="true"><div class="drawer-head"><h2 class="drawer-title" id="drawerTitle">로봇 상세 정보</h2><button class="close-icon" id="drawerCloseIcon" type="button" aria-label="닫기">×</button></div><div class="drawer-summary"><div class="drawer-summary-line"><span class="drawer-robot-name" id="drawerRobotName"></span><span class="badge" id="drawerBadge"></span></div><div class="drawer-received" id="drawerReceived"></div></div><div class="tabs" role="tablist"><button class="tab-button active" type="button" data-tab="basic">기본 정보</button><button class="tab-button" type="button" data-tab="position">위치 정보</button><button class="tab-button" type="button" data-tab="mission">미션 정보</button><button class="tab-button" type="button" data-tab="events">이벤트 이력</button></div><div class="tab-panel active" id="tab-basic"></div><div class="tab-panel" id="tab-position"></div><div class="tab-panel" id="tab-mission"></div><div class="tab-panel" id="tab-events"></div><button class="drawer-close" id="drawerCloseButton" type="button">상세 보기 닫기</button></aside>
<script>
const robotIds=['robot3','robot8'];
let mapMetadata=null;
const pairPending={};
const pairMessages={};
const uiState={selectedRobot:null,detailOpen:false,activeTab:'basic',robots:{
  robot3:{color:'blue',worker:'—',mission:'—',battery:null,estop:null,connected:false,state:'상태 수신 대기',description:'fleet/status 수신 대기',lastUpdate:'수신 전',missionStep:null,pairState:'NO_TARGET',showPairingFallback:false,x:null,y:null,yaw:null},
  robot8:{color:'green',worker:'—',mission:'—',battery:null,estop:null,connected:false,state:'상태 수신 대기',description:'fleet/status 수신 대기',lastUpdate:'수신 전',missionStep:null,pairState:'NO_TARGET',showPairingFallback:false,x:null,y:null,yaw:null}
},events:[{time:'—',robot:'—',mission:'—',type:'연동 대기',message:'이벤트 로그는 후속 단계에서 연결합니다.'}]};
const missionSteps=['배정','이동','대기','추종','복귀','도킹'];
const stateViews={
  UNKNOWN:['상태 확인 중','상태 출처 확인 중',null],IDLE:['대기','새 미션 대기',null],READY:['미션 대기','미션 수행 준비','배정'],
  SHUTTLE:['이동 중','창고 또는 대기공간으로 이동 중','이동'],AT_BAY:['창고 도착','창고에서 작업 중','이동'],WAITING:['대기 중','대기공간 도착','대기'],
  SEARCHING:['작업자 탐색 중','페어링할 작업자 탐색 중','대기'],PAIRED:['작업자 페어링','작업자 페어링 완료','대기'],APPROACH_1:['작업자 접근 중','작업자 1차 접근 중','추종'],APPROACH_2:['작업자 접근 중','작업자 2차 접근 중','추종'],ARRIVED:['추종 준비','작업자 접근 완료','추종'],
  FOLLOWING:['작업자 추종 중','페어링된 작업자 추종 중','추종'],STANDBY:['작업자 재탐색 대기','작업자 유실로 대기 중','추종'],RETURNING:['복귀 중','도크로 복귀 중','복귀'],DOCK_WAIT:['도킹 대기','DOCK 토큰 대기 중','복귀'],DOCKED:['도킹 완료','도크에 도킹됨','도킹'],FAILED:['미션 실패','로봇 상태 FAILED',null]
};
function viewForState(rawState){
  const raw=String(rawState||'UNKNOWN').toUpperCase();
  if(raw.startsWith('DOCKING'))return ['도킹 중',raw.replace('DOCKING','도킹'),'도킹'];
  return stateViews[raw]||[raw,`수신 상태: ${raw}`,null];
}
function stepMarkup(robot){const current=missionSteps.indexOf(robot.missionStep);return missionSteps.map((step,index)=>`<div class="step ${current>=0&&index<current?'done':''} ${index===current?'current':''}"><div class="step-circle"></div><span>${step}</span></div>`).join('')}
function estopText(value){return value===true?'감지':value===false?'정상':'확인 불가'}
function badgeClass(robot){if(robot.estop===true)return 'red';if(!robot.connected)return 'muted';return robot.color==='green'?'green':''}
async function postForm(url,data){const response=await fetch(url,{method:'POST',body:new URLSearchParams(data)});let result;try{result=await response.json()}catch(_error){throw new Error(`HTTP ${response.status}`)}if(!response.ok)throw new Error(result.message||`HTTP ${response.status}`);return result}
function parsePgm(buffer){
  const bytes=new Uint8Array(buffer);let index=0;
  function token(){while(index<bytes.length){if(bytes[index]===35){while(index<bytes.length&&bytes[index]!==10)index++}else if(bytes[index]<=32){index++}else break}const start=index;while(index<bytes.length&&bytes[index]>32&&bytes[index]!==35)index++;return new TextDecoder().decode(bytes.slice(start,index))}
  const magic=token();const width=Number(token());const height=Number(token());const maxValue=Number(token());if(magic!=='P5'||!Number.isInteger(width)||!Number.isInteger(height)||maxValue<=0||maxValue>255)throw new Error('지원하지 않는 PGM 형식');if(bytes[index]<=32)index++;const pixels=bytes.slice(index,index+width*height);if(pixels.length!==width*height)throw new Error('PGM 픽셀 크기 불일치');return {width,height,maxValue,pixels};
}
function sizeMapStage(){if(!mapMetadata)return;const container=document.getElementById('mapContainer');const stage=document.getElementById('mapStage');const bounds=container.getBoundingClientRect();const mapRatio=mapMetadata.height/mapMetadata.width;const containerRatio=bounds.width/bounds.height;if(containerRatio>mapRatio){stage.style.height=`${bounds.height}px`;stage.style.width=`${bounds.height*mapRatio}px`}else{stage.style.width=`${bounds.width}px`;stage.style.height=`${bounds.width/mapRatio}px`}}
function projectWorldPoint(x,y){if(!mapMetadata)return null;const [originX,originY,originYaw]=mapMetadata.origin;const dx=x-originX;const dy=y-originY;const cos=Math.cos(originYaw);const sin=Math.sin(originYaw);const mapX=cos*dx+sin*dy;const mapY=-sin*dx+cos*dy;const widthM=mapMetadata.width*mapMetadata.resolution;const heightM=mapMetadata.height*mapMetadata.resolution;if(mapX<0||mapY<0||mapX>widthM||mapY>heightM)return null;return {left:100-mapY/heightM*100,top:100-mapX/widthM*100,originYaw}}
function screenHeading(yaw,originYaw){return -90-(yaw-originYaw)*180/Math.PI}
function renderDockLandmarks(){
  const stage=document.getElementById('mapStage');stage.querySelectorAll('.dock-reference').forEach(element=>element.remove());(mapMetadata.docks||[]).forEach(dock=>{const point=projectWorldPoint(Number(dock.x),Number(dock.y));if(!point)return;const reference=document.createElement('div');reference.className='dock-reference';reference.style.left=`${point.left}%`;reference.style.top=`${point.top}%`;reference.style.setProperty('--heading',`${screenHeading(Number(dock.yaw),point.originYaw)}deg`);reference.title=`${dock.robot} 도크 기준 (${Number(dock.x).toFixed(3)}, ${Number(dock.y).toFixed(3)}, ${Number(dock.yaw).toFixed(3)})`;const arrow=document.createElement('span');arrow.className='dock-arrow';arrow.textContent='➤';const label=document.createElement('span');label.textContent=`${dock.robot} 도크`;reference.append(arrow,label);stage.appendChild(reference)})
}
function updateMapMarkers(){
  if(!mapMetadata)return;Object.entries(uiState.robots).forEach(([id,robot])=>{const marker=document.getElementById(`marker-${id}`);if(!Number.isFinite(robot.x)||!Number.isFinite(robot.y)){marker.hidden=true;return}const point=projectWorldPoint(robot.x,robot.y);if(!point){marker.hidden=true;return}marker.hidden=false;marker.style.left=`${point.left}%`;marker.style.top=`${point.top}%`;marker.style.setProperty('--heading',`${screenHeading(robot.yaw,point.originYaw)}deg`);marker.classList.toggle('stale',!robot.connected);marker.title=`map (${robot.x.toFixed(2)}, ${robot.y.toFixed(2)}), yaw ${robot.yaw.toFixed(2)} rad`});
}
async function loadMap(){
  const status=document.getElementById('mapStatus');try{const metadataResponse=await fetch('/map/metadata',{cache:'no-store'});if(!metadataResponse.ok)throw new Error(`맵 메타데이터 HTTP ${metadataResponse.status}`);const metadata=await metadataResponse.json();const imageResponse=await fetch(metadata.image_url,{cache:'no-store'});if(!imageResponse.ok)throw new Error(`맵 이미지 HTTP ${imageResponse.status}`);const pgm=parsePgm(await imageResponse.arrayBuffer());if(pgm.width!==metadata.width||pgm.height!==metadata.height)throw new Error('맵 메타데이터와 이미지 크기 불일치');const canvas=document.getElementById('mapCanvas');canvas.width=pgm.height;canvas.height=pgm.width;const context=canvas.getContext('2d');const image=context.createImageData(pgm.height,pgm.width);for(let sourceY=0;sourceY<pgm.height;sourceY++){for(let sourceX=0;sourceX<pgm.width;sourceX++){const source=sourceY*pgm.width+sourceX;const targetX=sourceY;const targetY=pgm.width-1-sourceX;const offset=(targetY*pgm.height+targetX)*4;const value=Math.round(pgm.pixels[source]/pgm.maxValue*255);image.data[offset]=value;image.data[offset+1]=value;image.data[offset+2]=value;image.data[offset+3]=255}}context.putImageData(image,0,0);mapMetadata=metadata;status.hidden=true;document.getElementById('mapStage').hidden=false;sizeMapStage();renderDockLandmarks();updateMapMarkers()}
  catch(error){status.textContent=`맵 연결 실패 · ${error.message}`;status.classList.add('error')}
}
function renderSummary(){
  const robots=Object.values(uiState.robots);const connected=robots.filter(r=>r.connected);const received=robots.filter(r=>r.estop!==null);
  document.getElementById('connectedCount').textContent=connected.length;
  document.getElementById('workerCount').textContent=new Set(connected.map(r=>r.worker).filter(v=>v&&v!=='—')).size;
  document.getElementById('missionCount').textContent=connected.filter(r=>r.mission&&r.mission!=='—').length;
  const estops=connected.filter(r=>r.estop===true).length;document.getElementById('estopCount').textContent=connected.length?estops:'—';
  const estopSummary=document.getElementById('estopSummary');estopSummary.textContent=!connected.length?'확인 불가':connected.length<robotIds.length?'일부 확인 불가':estops?'감지':'정상';estopSummary.style.color=estops?'var(--red)':connected.length===robotIds.length?'var(--green)':'var(--muted)';
  const ages=connected.map(r=>r.ageSeconds).filter(Number.isFinite);document.getElementById('globalLastUpdate').textContent=ages.length?`${Math.min(...ages).toFixed(1)}초 전`:'수신 전';
  const connectionText=document.getElementById('connectionText');connectionText.textContent=connected.length===robotIds.length?'로봇 상태 수신 정상':connected.length?`${connected.length}대 상태 수신`:(received.length?'로봇 상태 수신 지연':'로봇 상태 수신 대기');document.getElementById('connectionDot').classList.toggle('offline',connected.length!==robotIds.length);
  robotIds.forEach(id=>{const status=document.getElementById(`returnStatus${id[0].toUpperCase()+id.slice(1)}`);const robot=uiState.robots[id];status.textContent=robot.connected?robot.state:'상태 수신 지연'});
}
function renderRobotCards(){
  document.getElementById('robotCards').innerHTML=Object.entries(uiState.robots).map(([id,r])=>`<article class="robot-card card ${r.estop===true?'estop':''}" data-color="${r.color}"><div class="robot-main"><div class="robot-head"><h2 class="robot-name">${id}</h2><span class="badge ${badgeClass(r)}">${r.estop===true?'안전 정지':r.state}</span></div><div class="info-row"><span class="info-label">작업자</span><span class="info-value">${r.worker}</span></div><div class="info-row"><span class="info-label">미션</span><span class="info-value">${r.mission}</span></div><div class="info-row"><span class="info-label">배터리</span><span class="info-value battery-wrap"><b>${r.battery===null?'—':`${r.battery}%`}</b><span class="battery-track"><span class="battery-fill" style="width:${r.battery||0}%"></span></span></span></div><div class="info-row"><span class="info-label">E-STOP</span><span class="info-value" style="color:${r.estop===true?'var(--red)':r.estop===false?'var(--green)':'var(--muted)'}">● ${estopText(r.estop)}</span></div><div class="info-row"><span class="info-label">최근 수신</span><span class="info-value">${r.lastUpdate}</span></div><div class="card-actions"><button class="return-one-button" type="button" onclick="sendReturn('${id}')">작업 종료 → 복귀</button><button class="detail-button" type="button" onclick="openRobotDetail('${id}')">상세 보기 ›</button></div></div><div class="robot-progress"><div class="progress-title">미션 진행 상황</div><div class="steps">${stepMarkup(r)}</div><div class="location-row"><div class="location-box"><div class="location-label">현재 상태</div><div class="location-text">${r.description}</div></div><button class="fallback-button" type="button" ${r.showPairingFallback?'':'hidden'} onclick="openPairingFallback('${id}')">페어링<br>폴백</button></div></div></article>`).join('');
  Object.entries(uiState.robots).forEach(([id,r])=>document.getElementById(`marker-${id}`).classList.toggle('estop',r.estop===true));renderSummary();updateMapMarkers();
}
function applyStatusPayload(payload){
  robotIds.forEach(id=>{const data=payload[`/${id}`]||payload[id];const robot=uiState.robots[id];if(!data){Object.assign(robot,{worker:'—',mission:'—',battery:null,estop:null,connected:false,state:'상태 수신 대기',description:'fleet/status 수신 대기',lastUpdate:'수신 전',ageSeconds:null,missionStep:null,pairState:'NO_TARGET',showPairingFallback:false,x:null,y:null,yaw:null});return}const view=viewForState(data.state);const battery=Number(data.battery);const age=Number(data.age_s);const x=Number(data.x);const y=Number(data.y);const yaw=Number(data.yaw);const pairState=data.pair_state||'NO_TARGET';Object.assign(robot,{worker:data.worker||'—',mission:data.mission||'—',battery:Number.isFinite(battery)?Math.max(0,Math.min(100,Math.round(battery*100))):null,estop:Boolean(data.estop),connected:data.stale===false,state:view[0],description:view[1],lastUpdate:Number.isFinite(age)?`${age.toFixed(1)}초 전`:'수신 시각 없음',ageSeconds:Number.isFinite(age)?age:null,missionStep:view[2],pairState,showPairingFallback:pairState==='GATE_FAIL',x:Number.isFinite(x)?x:null,y:Number.isFinite(y)?y:null,yaw:Number.isFinite(yaw)?yaw:0})});
  const alertBox=document.getElementById('monitorAlert');const warning=(payload._monitor&&payload._monitor.duplicate_warning)||'';alertBox.textContent=warning;alertBox.hidden=!warning;
  renderRobotCards();if(uiState.detailOpen&&uiState.selectedRobot)openRobotDetail(uiState.selectedRobot);
}
async function pollFleetStatus(){
  try{const response=await fetch('/status',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);applyStatusPayload(await response.json())}
  catch(error){Object.values(uiState.robots).forEach(robot=>{robot.connected=false});renderRobotCards();document.getElementById('connectionText').textContent='상태 API 응답 없음';document.getElementById('connectionDot').classList.add('offline')}
}
function pairingControl(id,r){if(!r.showPairingFallback)return '';return `<section class="drawer-section"><h3>명시 페어링 폴백</h3><div class="pairing-control"><select id="pairWorker-${id}" aria-label="${id} 작업자 선택"><option value="W1">작업자 W1</option><option value="W2">작업자 W2</option></select><button id="pairButton-${id}" type="button" onclick="manualPair('${id}')" ${pairPending[id]?'disabled':''}>작업자 지정</button><div class="pairing-message" id="pairMessage-${id}" aria-live="polite">${pairMessages[id]||'작업자를 선택한 뒤 지정하세요.'}</div></div></section>`}
function drawerInfo(id,r){return `<section class="drawer-section"><h3>기본 정보</h3><div class="drawer-row"><span>작업자</span><span>${r.worker}</span></div><div class="drawer-row"><span>미션</span><span>${r.mission}</span></div><div class="drawer-row"><span>배터리</span><span>${r.battery===null?'—':`${r.battery}%`}</span></div><div class="drawer-row"><span>E-STOP</span><span style="color:${r.estop===true?'var(--red)':r.estop===false?'var(--green)':'var(--muted)'}">${estopText(r.estop)}</span></div><div class="drawer-row"><span>수신 상태</span><span>${r.connected?'정상':'수신 지연'}</span></div><div class="drawer-row"><span>페어링 상태</span><span>${r.pairState}</span></div><div class="drawer-row"><span>현재 상태</span><span>${r.state}</span></div><div class="drawer-row"><span>상태 설명</span><span>${r.description}</span></div><div class="drawer-row"><span>최근 수신</span><span>${r.lastUpdate}</span></div></section>${pairingControl(id,r)}<section class="drawer-section"><h3>진행 단계</h3><div class="steps">${stepMarkup(r)}</div></section>`}
function openRobotDetail(id){const r=uiState.robots[id];if(!uiState.detailOpen||uiState.selectedRobot!==id)uiState.activeTab='basic';uiState.selectedRobot=id;uiState.detailOpen=true;document.getElementById('drawerTitle').textContent=`${id} 상세 정보`;document.getElementById('drawerRobotName').textContent=id;const badge=document.getElementById('drawerBadge');badge.textContent=r.estop===true?'안전 정지':r.state;badge.className=`badge ${badgeClass(r)}`;document.getElementById('drawerReceived').textContent=`최근 수신 ${r.lastUpdate}`;document.getElementById('tab-basic').innerHTML=drawerInfo(id,r);document.getElementById('tab-position').innerHTML=`<section class="drawer-section"><h3>위치 정보</h3><div class="drawer-row"><span>x</span><span>${Number.isFinite(r.x)?r.x.toFixed(2)+' m':'—'}</span></div><div class="drawer-row"><span>y</span><span>${Number.isFinite(r.y)?r.y.toFixed(2)+' m':'—'}</span></div><div class="drawer-row"><span>yaw</span><span>${Number.isFinite(r.yaw)?r.yaw.toFixed(2)+' rad':'—'}</span></div></section>`;document.getElementById('tab-mission').innerHTML=`<section class="drawer-section"><h3>미션 정보</h3><div class="drawer-row"><span>미션</span><span>${r.mission}</span></div><div class="drawer-row"><span>현재 단계</span><span>${r.missionStep||'—'}</span></div></section>`;document.getElementById('tab-events').innerHTML='<section class="drawer-section"><h3>이벤트 이력</h3><p>후속 단계에서 연결합니다.</p></section>';document.getElementById('detailDrawer').classList.add('open');document.getElementById('detailDrawer').setAttribute('aria-hidden','false');selectTab(uiState.activeTab)}
function closeRobotDetail(){uiState.detailOpen=false;document.getElementById('detailDrawer').classList.remove('open');document.getElementById('detailDrawer').setAttribute('aria-hidden','true')}
function selectTab(name){uiState.activeTab=name;document.querySelectorAll('.tab-button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===`tab-${name}`))}
function openPairingFallback(id){openRobotDetail(id);const select=document.getElementById(`pairWorker-${id}`);if(select)select.focus()}
async function manualPair(id){if(pairPending[id])return;const select=document.getElementById(`pairWorker-${id}`);const button=document.getElementById(`pairButton-${id}`);const message=document.getElementById(`pairMessage-${id}`);pairPending[id]=true;button.disabled=true;message.textContent='페어링 요청 중';try{const result=await postForm('/manual_pair',{robot_ns:`/${id}`,worker_id:select.value});pairMessages[id]=result.message||result.reason||(result.ok?'명시 페어링 완료':'명시 페어링 거부');message.textContent=pairMessages[id]}catch(error){pairMessages[id]=`관제 서버 응답 없음 · ${error.message}`;message.textContent=pairMessages[id]}finally{pairPending[id]=false;button.disabled=false}}
async function sendReturn(id){const message=document.getElementById('commandMessage');message.textContent=`${id} 복귀 명령 전송 중`;try{const result=await postForm('/command',{robot_ns:`/${id}`,command:'RETURN'});message.textContent=result.message||(`${id} 복귀 명령 ${result.ok?'완료':'거부'}`)}catch(error){message.textContent=`관제 서버 응답 없음 · ${error.message}`}}
async function sendReturnAll(){const button=document.getElementById('returnAllButton');const message=document.getElementById('commandMessage');button.disabled=true;message.textContent='전체 복귀 명령 전송 중';try{const result=await postForm('/command',{robot_ns:'',command:'RETURN_ALL'});message.textContent=result.message||(`전체 복귀 명령 ${result.ok?'완료':'거부'}`)}catch(error){message.textContent=`관제 서버 응답 없음 · ${error.message}`}finally{button.disabled=false}}
window.setPairingFallback=function(id,visible){if(!uiState.robots[id])return;uiState.robots[id].pairState=visible?'GATE_FAIL':'NO_TARGET';uiState.robots[id].showPairingFallback=Boolean(visible);renderRobotCards()};
document.getElementById('eventRows').innerHTML=uiState.events.map(e=>`<tr><td>${e.time}</td><td>${e.robot}</td><td>${e.mission}</td><td>${e.type}</td><td>${e.message}</td></tr>`).join('');
document.getElementById('requestForm').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('requestButton');const resultBox=document.getElementById('requestResult');button.disabled=true;resultBox.textContent='자재 요청 전송 중';try{const result=await postForm('/request',{worker_id:document.getElementById('requestWorker').value,bay:document.getElementById('requestBay').value});resultBox.textContent=result.message||(result.ok?'자재 요청 접수 완료':'자재 요청 거부')}catch(error){resultBox.textContent=`관제 서버 응답 없음 · ${error.message}`}finally{button.disabled=false}});
document.getElementById('returnAllButton').addEventListener('click',sendReturnAll);
document.getElementById('eventToggle').addEventListener('click',()=>{const card=document.getElementById('eventCard');const open=card.classList.toggle('open');document.getElementById('eventToggle').setAttribute('aria-expanded',String(open));document.getElementById('eventToggleLabel').textContent=open?'접기 ▲':'펼치기 ▼'});
document.getElementById('drawerCloseIcon').addEventListener('click',closeRobotDetail);document.getElementById('drawerCloseButton').addEventListener('click',closeRobotDetail);document.querySelectorAll('.tab-button').forEach(b=>b.addEventListener('click',()=>selectTab(b.dataset.tab)));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRobotDetail()});window.addEventListener('resize',sizeMapStage);renderRobotCards();loadMap();pollFleetStatus();window.setInterval(pollFleetStatus,1000);
</script>
</body>
</html>
