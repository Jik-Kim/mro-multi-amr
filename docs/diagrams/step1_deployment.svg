<rect x="24" y="126" width="236" height="142" rx="5" fill="#EEF4FD" stroke="#3576C8" stroke-width="1.6"/><text x="36" y="147" font-size="12.5" font-weight="700" fill="#1B4F91">PC-W1 — 웹캠1 PC</text><text x="36" y="166" font-size="11" fill="#3A3E46">Ubuntu 24.04 · ROS 2 Jazzy</text><text x="36" y="181" font-size="11" fill="#3A3E46">pkg  mro_webcam</text><text x="36" y="196" font-size="11" fill="#3A3E46">• webcam_register</text><text x="36" y="211" font-size="11" fill="#3A3E46">   작업자 등록 · 외형 서술자 발행</text><text x="36" y="226" font-size="11" fill="#3A3E46">USB 웹캠 640×480 (출입구 시야)</text><text x="36" y="241" font-size="11" fill="#3A3E46">ROS_SUPER_CLIENT = False</text><text x="36" y="256" font-size="11" fill="#3A3E46">담당  한세교 · 김학민</text>
<rect x="273" y="126" width="236" height="142" rx="5" fill="#EEF4FD" stroke="#3576C8" stroke-width="1.6"/><text x="285" y="147" font-size="12.5" font-weight="700" fill="#1B4F91">PC-W2 — 웹캠2 PC</text><text x="285" y="166" font-size="11" fill="#3A3E46">Ubuntu 24.04 · ROS 2 Jazzy</text><text x="285" y="181" font-size="11" fill="#3A3E46">pkg  mro_webcam</text><text x="285" y="196" font-size="11" fill="#3A3E46">• webcam_hint</text><text x="285" y="211" font-size="11" fill="#3A3E46">   재탐지 방위 힌트 · KPI 계측</text><text x="285" y="226" font-size="11" fill="#3A3E46">USB 웹캠 640×480 (작업공간 남단)</text><text x="285" y="241" font-size="11" fill="#3A3E46">ROS_SUPER_CLIENT = False</text><text x="285" y="256" font-size="11" fill="#3A3E46">담당  한세교 · 김학민</text>
<rect x="522" y="126" width="236" height="172" rx="5" fill="#FDF3E3" stroke="#B06810" stroke-width="1.6"/><text x="534" y="147" font-size="12.5" font-weight="700" fill="#8A4F0B">PC-F — 관제 PC</text><text x="534" y="166" font-size="11" fill="#3A3E46">Ubuntu 24.04 · Jazzy · GPU 불필요</text><text x="534" y="181" font-size="11" fill="#3A3E46">IP 192.168.108.41/24 (고정)</text><text x="534" y="196" font-size="11" fill="#3A3E46">★ Fast DDS Discovery Server</text><text x="534" y="211" font-size="11" fill="#3A3E46">    서버 ID 1 · UDP 11811</text><text x="534" y="226" font-size="11" fill="#3A3E46">pkg  mro_fleet</text><text x="534" y="241" font-size="11" fill="#3A3E46">• fleet_manager   • zone_semaphore</text><text x="534" y="256" font-size="11" fill="#3A3E46">• control_ui (Flask :5000)</text><text x="534" y="271" font-size="11" fill="#3A3E46">• kpi_logger · SQLite</text><text x="534" y="286" font-size="11" fill="#3A3E46">담당  김민준</text>
<rect x="771" y="126" width="236" height="157" rx="5" fill="#EEF4FD" stroke="#3576C8" stroke-width="1.6"/><text x="783" y="147" font-size="12.5" font-weight="700" fill="#1B4F91">PC-R3 — 로봇3 제어 PC</text><text x="783" y="166" font-size="11" fill="#3A3E46">Ubuntu 24.04 · Jazzy · NVIDIA GPU</text><text x="783" y="181" font-size="11" fill="#3A3E46">Nav2 + AMCL + RViz2</text><text x="783" y="196" font-size="11" fill="#3A3E46">pkg  mro_perception</text><text x="783" y="211" font-size="11" fill="#3A3E46">• amr_detection  • aruco_detector</text><text x="783" y="226" font-size="11" fill="#3A3E46">pkg  mro_navigation</text><text x="783" y="241" font-size="11" fill="#3A3E46">• shuttle_mission  • follow_target</text><text x="783" y="256" font-size="11" fill="#3A3E46">• return_dock  • safety_watchdog</text><text x="783" y="271" font-size="11" fill="#3A3E46">namespace = /robot3</text>
<rect x="1020" y="126" width="236" height="157" rx="5" fill="#EEF4FD" stroke="#3576C8" stroke-width="1.6"/><text x="1032" y="147" font-size="12.5" font-weight="700" fill="#1B4F91">PC-R4 — 로봇4 제어 PC</text><text x="1032" y="166" font-size="11" fill="#3A3E46">Ubuntu 24.04 · Jazzy · NVIDIA GPU</text><text x="1032" y="181" font-size="11" fill="#3A3E46">Nav2 + AMCL + RViz2</text><text x="1032" y="196" font-size="11" fill="#3A3E46">pkg  mro_perception</text><text x="1032" y="211" font-size="11" fill="#3A3E46">• amr_detection  • aruco_detector</text><text x="1032" y="226" font-size="11" fill="#3A3E46">pkg  mro_navigation</text><text x="1032" y="241" font-size="11" fill="#3A3E46">• shuttle_mission  • follow_target</text><text x="1032" y="256" font-size="11" fill="#3A3E46">• return_dock  • safety_watchdog</text><text x="1032" y="271" font-size="11" fill="#3A3E46">namespace = /robot4</text>
<rect x="24" y="402" width="1232" height="52" rx="5" fill="#FDF3E3" stroke="#B06810" stroke-width="1.6"/><text x="36" y="423" font-size="12.5" font-weight="700" fill="#8A4F0B">ROS_DISCOVERY_SERVER = &quot;;192.168.108.41:11811&quot;      ← 앞의 세미콜론 하나가 &quot;서버 ID 1&quot; 을 뜻한다. 5대 PC + 로봇 2대가 모두 같은 값을 쓴다.</text><text x="36" y="442" font-size="11" fill="#3A3E46">이 경로로 오가는 것은 참가자·토픽 탐색 정보뿐이다. 실제 토픽 데이터는 발행 노드와 구독 노드 사이를 직접(P2P) 흐르므로 PC-F 를 거치지 않는다.</text>
<rect x="771" y="512" width="236" height="157" rx="5" fill="#E9F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="783" y="533" font-size="12.5" font-weight="700" fill="#1E6B40">robot3 — TurtleBot4 Standard</text><text x="783" y="552" font-size="11" fill="#3A3E46">Raspberry Pi 4B · Ubuntu 24.04</text><text x="783" y="567" font-size="11" fill="#3A3E46">turtlebot4_bringup · _node</text><text x="783" y="582" font-size="11" fill="#3A3E46">depthai_ros_driver → OAK-D Pro</text><text x="783" y="597" font-size="11" fill="#3A3E46">rplidar_ros → RPLIDAR A1</text><text x="783" y="612" font-size="11" fill="#3A3E46">iRobot Create3 (범퍼·클리프·도크)</text><text x="783" y="627" font-size="11" fill="#3A3E46">onboard Discovery ID 3 — 남겨두되</text><text x="783" y="642" font-size="11" fill="#3A3E46">PC 의 접속 목록에는 넣지 않는다</text><text x="783" y="657" font-size="11" fill="#3A3E46">Offboard IP → 192.168.108.41</text>
<rect x="1020" y="512" width="236" height="157" rx="5" fill="#E9F6EE" stroke="#2E8B57" stroke-width="1.6"/><text x="1032" y="533" font-size="12.5" font-weight="700" fill="#1E6B40">robot4 — TurtleBot4 Standard</text><text x="1032" y="552" font-size="11" fill="#3A3E46">Raspberry Pi 4B · Ubuntu 24.04</text><text x="1032" y="567" font-size="11" fill="#3A3E46">turtlebot4_bringup · _node</text><text x="1032" y="582" font-size="11" fill="#3A3E46">depthai_ros_driver → OAK-D Pro</text><text x="1032" y="597" font-size="11" fill="#3A3E46">rplidar_ros → RPLIDAR A1</text><text x="1032" y="612" font-size="11" fill="#3A3E46">iRobot Create3 (범퍼·클리프·도크)</text><text x="1032" y="627" font-size="11" fill="#3A3E46">onboard Discovery ID 4 — 남겨두되</text><text x="1032" y="642" font-size="11" fill="#3A3E46">PC 의 접속 목록에는 넣지 않는다</text><text x="1032" y="657" font-size="11" fill="#3A3E46">Offboard IP → 192.168.108.41</text>
<rect x="24" y="512" width="723" height="247" rx="5" fill="#F7F8FA" stroke="#C9CFD6" stroke-width="1.6"/><text x="36" y="533" font-size="12.5" font-weight="700" fill="#333840">읽는 법 · 확인 상태</text><text x="36" y="552" font-size="11" fill="#3A3E46">─── 주황 실선 = 디스커버리 등록 경로. 모든 참가자가 PC-F 의 서버 하나에만 등록한다.</text><text x="36" y="567" font-size="11" fill="#3A3E46">      토픽 데이터 경로는 P2P 라서 이 그림에 선으로 그리지 않는다 (STEP 2 가 그 내용이다).</text><text x="36" y="582" font-size="11" fill="#3A3E46"></text><text x="36" y="597" font-size="11" fill="#3A3E46">[검증됨] 2026-09-05 — PC 5대와 로봇 2대를 모두 붙인 뒤 각 PC 에서 /robot3 · /robot4 토픽이</text><text x="36" y="612" font-size="11" fill="#3A3E46">      동시에 보이는 것을 확인했다. 통신 구성은 이 상태로 확정한다 (SDD NR-01).</text><text x="36" y="627" font-size="11" fill="#3A3E46"></text><text x="36" y="642" font-size="11" fill="#3A3E46">이 구조를 택한 이유 — 종전에는 로봇의 라즈베리파이가 디스커버리 허브를 겸했다. PC 가 늘어날수록</text><text x="36" y="657" font-size="11" fill="#3A3E46">      RPi 가 병목이 되고, 로봇 2대면 PC 마다 서버 두 곳을 동시에 봐야 해서 설정이 갈라진다.</text><text x="36" y="672" font-size="11" fill="#3A3E46">      서버를 관제 노트북 한 대로 빼면 RPi 는 자기 센서 처리에만 쓰이고, 모든 PC 의 설정이 한 줄로 같아진다.</text><text x="36" y="687" font-size="11" fill="#3A3E46"></text><text x="36" y="702" font-size="11" fill="#3A3E46">웹캠 PC 와 nav2 터미널은 ROS_SUPER_CLIENT = False 로 둔다. 전체 토픽 목록이 필요한 도구</text><text x="36" y="717" font-size="11" fill="#3A3E46">      (ros2 topic list, RViz 탐색)를 쓸 때만 True 가 필요하고, 상시 True 는 불필요한 트래픽을 만든다.</text><text x="36" y="732" font-size="11" fill="#3A3E46"></text><text x="36" y="747" font-size="11" fill="#3A3E46">고정 IP 192.168.108.41 은 공유기 DHCP 예약이 아직 걸려 있지 않다 → 강사님께 예약 요청 필요.</text>







<text x="24" y="781" font-size="10" fill="#8A8F98">생성: tools/build_diagrams.py   ·   원본 근거: docs/setup.md, docs/architecture.md, SDD 2.3 NR-01</text>
</svg>