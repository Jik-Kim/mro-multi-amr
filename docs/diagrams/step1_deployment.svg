<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#1A1D22">STEP 1 — 시스템 배치도 (PC 5대 · AMR 2대 · 네트워크)</text>
<text x="24" y="55" font-size="12" fill="#5A5F6A">MRO Multi-AMR Phase 1 · 2026-09-05 구성 확정 및 검증 완료 · SDD 3.1</text>
<rect x="24" y="70" width="1232" height="34" rx="6" fill="#FAFBFC" stroke="#D7DBE0" stroke-width="1" stroke-dasharray="5 4"/><text x="36" y="89" font-size="12" font-weight="700" fill="#5A5F6A">무선망 SSID turtle08   ·   ROS_DOMAIN_ID = 3   ·   RMW = rmw_fastrtps_cpp   ·   전송 = Fast DDS Discovery Server 방식 (멀티캐스트 미사용)</text>
