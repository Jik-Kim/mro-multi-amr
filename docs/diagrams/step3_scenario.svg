<text x="24" y="728" font-size="12" fill="#5A5F6A" font-weight="700">예외 처리</text>
<text x="186" y="760" font-size="11" fill="#3A3E46">같은 인형끼리와 다른 인형끼리의 유사도 분포가 겹치면 서술자를 손봐야 한다는 신호다. 조명을 맞추고 다시 등록한다.</text>
<text x="186" y="787" font-size="11" fill="#3A3E46">각 로봇이 (0,0) 으로 초기화하면 같은 좌표가 다른 장소를 가리킨다. arena.yaml 의 dock_zone.pose 값으로 초기화한다.</text>
<text x="186" y="814" font-size="11" fill="#3A3E46">다시 접근해 마커를 읽는다. T_lim 120 초를 넘기면 FAILED. 늦은 도착은 arrived_late 로 따로 남겨 이중 계상하지 않는다.</text>
<text x="186" y="841" font-size="11" fill="#3A3E46">거절되면 2 초 뒤 다시 요청한다. 구역에 들어가기 전에 얻고 빠져나온 뒤 반납한다. 60 초를 넘겨 쥐면 강제 회수한다.</text>
<text x="186" y="868" font-size="11" fill="#3A3E46">유사도가 임계에 못 미치면 페어링하지 않고 대기한다. 확신이 없을 때 멈추는 쪽이 항상 옳다. 폴백은 운영자 수동 지정.</text>
<text x="186" y="895" font-size="11" fill="#3A3E46">작업공간이면 웹캠2 힌트 방향으로 회전 탐색, 중앙 복도는 시야 밖이라 제자리 탐색. T_lim 초과 시 STANDBY.</text>
<text x="186" y="922" font-size="11" fill="#3A3E46">safety/estop 을 올리고 cmd_vel 에 0 을 20 Hz 로 덮어쓴다. 0.45 m 밖이면 스스로 재개. 개입(IPH)에 계상하지 않는다.</text>
<text x="186" y="949" font-size="11" fill="#3A3E46">도크 간격이 0.84 m 뿐이라 동시에 들어가면 IR 이 간섭한다. DOCK 토큰으로 한 대씩, 나머지는 홀딩 포인트 대기.</text>
<text x="186" y="976" font-size="11" fill="#3A3E46">최대 2회 재시도 후 FAILED 를 발행하고 멈춘다. 성공이든 실패든 DOCK 토큰은 반드시 반납한다.</text>
<text x="24" y="1013" font-size="11" fill="#5A5F6A">전 구간 공통 — 모든 로그와 CSV 는 ROS 시각을 쓴다. 안전 정지 뒤의 자동 재개는 개입으로 계상하지 않는다.</text>
<text x="24" y="1033" font-size="10" fill="#8A8F98">생성: tools/build_diagrams.py   ·   근거: BRD 3.2 시나리오, SDD 3.3, docs/interfaces.md</text>
</svg>