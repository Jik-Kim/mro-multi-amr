<text x="24" y="34" font-size="19" font-weight="700" fill="#1A1D22">STEP 2 — 로봇 1대(/robotN) 내부 구성과 Nav2 스택과의 교환</text>
<text x="24" y="55" font-size="12" fill="#5A5F6A">robot3 · robot8 는 네임스페이스만 다르고 구성은 같다 · SDD 3.2</text>
<rect x="24" y="74" width="300" height="694" rx="6" fill="#FAFBFC" stroke="#D7DBE0" stroke-width="1" stroke-dasharray="5 4"/><text x="36" y="93" font-size="12" font-weight="700" fill="#5A5F6A">A. 센서 · 구동 (로봇 온보드) 및 외부 입력</text>
