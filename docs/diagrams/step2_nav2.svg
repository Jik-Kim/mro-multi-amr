<rect x="40" y="110" width="268" height="97" rx="5" fill="#F1F2F4" stroke="#5A5F6A" stroke-width="1.6"/><text x="52" y="131" font-size="12.5" font-weight="700" fill="#333840">OAK-D Pro  ·  depthai_ros_driver</text><text x="52" y="150" font-size="11" fill="#3A3E46">oakd/rgb/image_raw/compressed</text><text x="52" y="165" font-size="11" fill="#3A3E46">oakd/stereo/…/compressedDepth</text><text x="52" y="180" font-size="11" fill="#3A3E46">oakd/rgb/camera_info</text><text x="52" y="195" font-size="11" fill="#3A3E46">704×704 @10 Hz · 깊이 정렬 · subpixel</text>
<rect x="40" y="237" width="268" height="52" rx="5" fill="#F1F2F4" stroke="#5A5F6A" stroke-width="1.6"/><text x="52" y="258" font-size="12.5" font-weight="700" fill="#333840">RPLIDAR A1  ·  rplidar_ros</text><text x="52" y="277" font-size="11" fill="#3A3E46">scan  (LaserScan, 10 Hz)</text>
<rect x="40" y="319" width="268" height="67" rx="5" fill="#F1F2F4" stroke="#5A5F6A" stroke-width="1.6"/><text x="52" y="340" font-size="12.5" font-weight="700" fill="#333840">iRobot Create3</text><text x="52" y="359" font-size="11" fill="#3A3E46">odom · tf · battery_state</text><text x="52" y="374" font-size="11" fill="#3A3E46">범퍼 · 클리프 (하드웨어 안전)</text>
<rect x="40" y="416" width="268" height="112" rx="5" fill="#F7F8FA" stroke="#8A8F98" stroke-width="1.6"/><text x="52" y="437" font-size="12.5" font-weight="700" fill="#333840">외부 입력 (PC-F · 웹캠 PC 에서 옴)</text><text x="52" y="456" font-size="11" fill="#3A3E46">mission/assigned      S4 셔틀 트리거</text><text x="52" y="471" font-size="11" fill="#3A3E46">mission/finish          S9 종료 신호</text><text x="52" y="486" font-size="11" fill="#3A3E46">/webcam1/worker_descriptor</text><text x="52" y="501" font-size="11" fill="#3A3E46">/webcam2/target_hint   재탐지 힌트</text><text x="52" y="516" font-size="11" fill="#3A3E46">/fleet/zone_token   서비스 · P1 · DOCK</text>
<rect x="372" y="110" width="318" height="67" rx="5" fill="#EEF4FD" stroke="#3576C8" stroke-width="1.6"/><text x="384" y="131" font-size="12.5" font-weight="700" fill="#1B4F91">aruco_detector   (mro_perception)</text><text x="384" y="150" font-size="11" fill="#3A3E46">DICT_4X4_50 · 베이 ID 1/2/3 판독</text><text x="384" y="165" font-size="11" fill="#3A3E46">aruco/id · aruco/distance</text>
<rect x="372" y="207" width="318" height="67" rx="5" fill="#EEF4FD" stroke="#3576C8" stroke-width="1.6"/><text x="384" y="228" font-size="12.5" font-weight="700" fill="#1B4F91">shuttle_mission   (mro_navigation)</text><text x="384" y="247" font-size="11" fill="#3A3E46">S2 undock · S4 베이 왕복 · Z-05 대기공간</text><text x="384" y="262" font-size="11" fill="#3A3E46">shuttle/status · shuttle/arrived</text>
<rect x="372" y="304" width="318" height="97" rx="5" fill="#EEF4FD" stroke="#3576C8" stroke-width="1.6"/><text x="384" y="325" font-size="12.5" font-weight="700" fill="#1B4F91">amr_detection   (mro_perception)</text><text x="384" y="344" font-size="11" fill="#3A3E46">YOLO11n worker.pt + HSV 재식별 게이트</text><text x="384" y="359" font-size="11" fill="#3A3E46">target/map_point · target/visible</text><text x="384" y="374" font-size="11" fill="#3A3E46">target/paired · target/worker_id</text><text x="384" y="389" font-size="11" fill="#3A3E46">target/distance  ← 추종거리 판정의 기준값</text>
<rect x="372" y="431" width="318" height="82" rx="5" fill="#EEF4FD" stroke="#3576C8" stroke-width="1.6"/><text x="384" y="452" font-size="12.5" font-weight="700" fill="#1B4F91">follow_target   (mro_navigation)</text><text x="384" y="471" font-size="11" fill="#3A3E46">S5 합류 · S6~S8 추종 (간격 0.5 m)</text><text x="384" y="486" font-size="11" fill="#3A3E46">Lost → 힌트 방향 탐색 → STANDBY</text><text x="384" y="501" font-size="11" fill="#3A3E46">approach/status</text>
<rect x="372" y="543" width="318" height="52" rx="5" fill="#EEF4FD" stroke="#3576C8" stroke-width="1.6"/><text x="384" y="564" font-size="12.5" font-weight="700" fill="#1B4F91">return_dock   (mro_navigation)</text><text x="384" y="583" font-size="11" fill="#3A3E46">S10 복귀 · DOCK 토큰 · 도킹 재시도 2회</text>
<rect x="372" y="625" width="318" height="97" rx="5" fill="#FCECEC" stroke="#C0392B" stroke-width="1.6"/><text x="384" y="646" font-size="12.5" font-weight="700" fill="#8E2A1F">safety_watchdog   (mro_navigation)</text><text x="384" y="665" font-size="11" fill="#3A3E46">scan 만 구독 · 전방 ±35°</text><text x="384" y="680" font-size="11" fill="#3A3E46">정지 0.30 m / 해제 0.45 m</text><text x="384" y="695" font-size="11" fill="#3A3E46">safety/estop · cmd_vel = 0 @20 Hz</text><text x="384" y="710" font-size="11" fill="#8A2E22">YOLO · 웹캠 · Wi-Fi 에 의존하지 않는다</text>
<rect x="764" y="110" width="308" height="67" rx="5" fill="#F3EEFA" stroke="#6B4FA8" stroke-width="1.6"/><text x="776" y="131" font-size="12.5" font-weight="700" fill="#4B357A">bt_navigator</text><text x="776" y="150" font-size="11" fill="#3A3E46">action  navigate_to_pose</text><text x="776" y="165" font-size="11" fill="#3A3E46">동작 트리가 계획 · 제어 · 복구를 조립한다</text>
<rect x="764" y="207" width="308" height="52" rx="5" fill="#F3EEFA" stroke="#6B4FA8" stroke-width="1.6"/><text x="776" y="228" font-size="12.5" font-weight="700" fill="#4B357A">planner_server  (Smac / NavFn)</text><text x="776" y="247" font-size="11" fill="#3A3E46">전역 경로 생성 (정적 맵 + 전역 costmap)</text>
<rect x="764" y="289" width="308" height="52" rx="5" fill="#F3EEFA" stroke="#6B4FA8" stroke-width="1.6"/><text x="776" y="310" font-size="12.5" font-weight="700" fill="#4B357A">controller_server  (RPP / DWB)</text><text x="776" y="329" font-size="11" fill="#3A3E46">지역 경로 추종 → 속도 명령 산출</text>
<rect x="764" y="371" width="308" height="52" rx="5" fill="#F3EEFA" stroke="#6B4FA8" stroke-width="1.6"/><text x="776" y="392" font-size="12.5" font-weight="700" fill="#4B357A">behavior_server</text><text x="776" y="411" font-size="11" fill="#3A3E46">spin · backup · wait  (복구 동작)</text>
<rect x="764" y="453" width="308" height="67" rx="5" fill="#F3EEFA" stroke="#6B4FA8" stroke-width="1.6"/><text x="776" y="474" font-size="12.5" font-weight="700" fill="#4B357A">global / local costmap</text><text x="776" y="493" font-size="11" fill="#3A3E46">입력: 정적 맵 + scan</text><text x="776" y="508" font-size="11" fill="#3A3E46">inflation_radius 0.25 — 받침대 덮기 (I-009)</text>
<rect x="764" y="550" width="308" height="67" rx="5" fill="#F3EEFA" stroke="#6B4FA8" stroke-width="1.6"/><text x="776" y="571" font-size="12.5" font-weight="700" fill="#4B357A">amcl  +  map_server</text><text x="776" y="590" font-size="11" fill="#3A3E46">입력: scan + odom + 정적 맵</text><text x="776" y="605" font-size="11" fill="#3A3E46">출력: amcl_pose · map→odom 변환</text>
<rect x="764" y="647" width="308" height="52" rx="5" fill="#F3EEFA" stroke="#6B4FA8" stroke-width="1.6"/><text x="776" y="668" font-size="12.5" font-weight="700" fill="#4B357A">opennav_docking</text><text x="776" y="687" font-size="11" fill="#3A3E46">action  dock / undock  (Create3 IR 도크)</text>
<rect x="1128" y="289" width="168" height="52" rx="5" fill="#F3EEFA" stroke="#6B4FA8" stroke-width="1.6"/><text x="1140" y="310" font-size="12.5" font-weight="700" fill="#4B357A">velocity_smoother</text><text x="1140" y="329" font-size="11" fill="#3A3E46">cmd_vel (TwistStamped)</text>
<rect x="1128" y="381" width="168" height="52" rx="5" fill="#F1F2F4" stroke="#5A5F6A" stroke-width="1.6"/><text x="1140" y="402" font-size="12.5" font-weight="700" fill="#333840">Create3 구동부</text><text x="1140" y="421" font-size="11" fill="#3A3E46">v ≤ 0.3 m/s</text>
<rect x="24" y="784" width="1292" height="217" rx="5" fill="#F7F8FA" stroke="#C9CFD6" stroke-width="1.6"/><text x="36" y="805" font-size="12.5" font-weight="700" fill="#333840">교환 지점 — 번호별 내용</text><text x="36" y="824" font-size="11" fill="#3A3E46">①  rgb + depth + camera_info 를 message_filters 로 동기화해 사람 검출과 거리 산출에 쓴다.      ②  rgb 만 받아 ArUco 를 읽는다.</text><text x="36" y="839" font-size="11" fill="#3A3E46">③  scan 은 안전 감시가 직접 구독한다. 인지·웹캠·관제 어느 것도 이 경로에 끼지 않는다.</text><text x="36" y="854" font-size="11" fill="#3A3E46">④⑤⑥  관제·웹캠에서 오는 트리거. mission/assigned → 셔틀 시작 · /webcam2/target_hint → 재탐지 방향 · mission/finish → 추종 즉시 중단 및 복귀 시작.</text><text x="36" y="869" font-size="11" fill="#3A3E46">⑦  target/paired 가 참일 때만 추종이 시작된다 (재식별 게이트).      ⑧  베이 도착 판정의 근거.</text><text x="36" y="884" font-size="11" fill="#3A3E46">⑨⑩⑪  우리 노드가 Nav2 에 붙는 주행 인터페이스는 navigate_to_pose 액션 하나뿐이다. 경로 계획과 지역 제어는 Nav2 에 맡긴다.</text><text x="36" y="899" font-size="11" fill="#3A3E46">⑫⑬  도킹도 opennav_docking 액션에 맡긴다. 우리가 정하는 것은 언제 부를지와 실패 시 몇 번 다시 부를지뿐이다.</text><text x="36" y="914" font-size="11" fill="#3A3E46">⑭  amcl_pose 로 카메라가 본 대상을 map 프레임 좌표로 옮긴다. 두 로봇이 같은 맵 원점을 쓰기 때문에 이 값이 서로 통한다.</text><text x="36" y="929" font-size="11" fill="#3A3E46">⑮⑯  Nav2 가 낸 속도 명령이 평활화를 거쳐 Create3 로 간다.</text><text x="36" y="944" font-size="11" fill="#3A3E46">⑰  안전 감시는 정지 조건에서 cmd_vel 에 0 을 20 Hz 로 덮어써 Nav2 출력을 이긴다.      ⑱  safety/estop 을 받은 우리 노드는 새 주행 명령을 내지 않는다.</text><text x="36" y="959" font-size="11" fill="#3A3E46"></text><text x="36" y="974" font-size="11" fill="#3A3E46">설계 원칙 — 안전은 온보드(scan + costmap)에서만 성립시킨다. 웹캠 · 재식별 · 관제는 &quot;더 잘 하게&quot; 할 뿐 &quot;안 부딪히게&quot; 하는 일에는 관여하지 않는다.</text><text x="36" y="989" font-size="11" fill="#3A3E46">           그래야 Wi-Fi 가 끊기거나 웹캠이 죽어도 무사고가 유지된다. (AGENTS.md 안전 계층 원칙)</text>
